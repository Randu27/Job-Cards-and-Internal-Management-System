<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resource Coordination - Grafix Print Hub</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <style>
        :root {
            --primary-color: #ffe785;
            --secondary-color: #fdfcf0;
        }
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .navbar { background-color: var(--primary-color); }
        .navbar-brand { color: #000000 !important; font-weight: 700; }
        .bi-list { color: #000000 !important; }
        .offcanvas { background-color: var(--primary-color); width: 280px !important; }
        .nav-link { color: #000000; padding: 15px 20px; transition: 0.3s; text-decoration: none; display: block; }
        .nav-link:hover, .nav-link.active { color: white !important; background: #34495e; }
        .hero-section { background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%); color: white; padding: 12px 0; }
        .feature-card { border: none; border-radius: 15px; transition: 0.3s; }
        .feature-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        
        /* New styles for log and actions */
        #activityLog { max-height: 200px; overflow-y: auto; }
        .log-entry { padding: 5px 0; border-bottom: 1px solid #eee; }
    </style>
</head>
<body>

<nav class="navbar navbar-dark shadow-sm sticky-top">
    <div class="container">
        <div class="d-flex align-items-center">
            <button class="btn btn-outline-dark me-3" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebarMenu">
                <i class="bi bi-list fs-4"></i>
            </button>
            <a class="navbar-brand d-flex align-items-center" href="#">
                <img src="../../assets/logo.png" alt="Logo" height="65" class="me-2">
                Grafix Print Hub
            </a>
        </div>
    </div>
</nav>

<div class="offcanvas offcanvas-start" tabindex="-1" id="sidebarMenu">
    <div class="offcanvas-header border-bottom border-dark">
        <h5 class="offcanvas-title fw-bold">Main Menu</h5>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
    </div>
    <div class="offcanvas-body p-0">
        <nav class="nav flex-column mt-3">
            <a href="../order_manager/order_dashboard.html" class="nav-link"><i class="bi bi-card-checklist me-2"></i> Order Admin</a>
            <a href="../financial_manager/financial_dashboard.html" class="nav-link"><i class="bi bi-card-checklist me-2"></i> Financial Management</a>
            <a href="../R.coordinater/resource.html" class="nav-link active"><i class="bi bi-box-seam me-2"></i> Resource Coord.</a>
            <a href="../Client_profile/CRMIndex.html" class="nav-link"><i class="bi bi-people me-2"></i> CRM</a>
            <a href="../hr_manager/hr-index.html" class="nav-link"><i class="bi bi-person-badge me-2"></i> Human Resources</a>
        </nav>
    </div>
</div>

<main>
    <div class="hero-section text-center mb-4 shadow">
        <h1 class="fw-bold">Resource Coordination</h1>
    </div>

    <div class="container mt-4">
        <div class="row g-4">
            <div class="col-md-4">
                <div class="card feature-card shadow-sm p-4">
                    <h4 class="mb-3">Update Stock</h4>
                    <div class="mb-3">
                        <label class="form-label">Material Name</label>
                        <input type="text" id="materialName" class="form-control" placeholder="e.g. Cyan Ink">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Quantity to Add</label>
                        <input type="number" id="materialQty" class="form-control" value="1">
                    </div>
                    <button class="btn btn-dark w-100" onclick="updateStock()">
                        <i class="bi bi-plus-circle me-2"></i>Update Stock
                    </button>
                </div>

                <div class="card feature-card shadow-sm p-4 mt-4">
                    <h4 class="mb-3">Recent Activity</h4>
                    <div id="activityLog" class="small text-muted">
                        <div class="log-entry">No recent updates.</div>
                    </div>
                </div>
            </div>

            <div class="col-md-8">
                <div class="card feature-card shadow-sm p-4">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h4 class="m-0">Current Stock</h4>
                        <input type="text" id="stockSearch" class="form-control form-control-sm w-50" placeholder="Search resources..." onkeyup="filterStock()">
                    </div>
                    <table class="table align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>Resource</th>
                                <th>Stock</th>
                                <th>Status</th>
                                <th class="text-center">Action</th>
                            </tr>
                        </thead>
                        <tbody id="stockTableBody">
                            <tr>
                                <td>A4 Glossy Paper</td>
                                <td>500</td>
                                <td><span class="badge bg-success">Healthy</span></td>
                                <td class="text-center">
                                    <button class="btn btn-sm btn-outline-danger" onclick="deleteRow(this)"><i class="bi bi-trash"></i></button>
                                </td>
                            </tr>
                            <tr>
                                <td>Cyan Ink</td>
                                <td>12</td>
                                <td><span class="badge bg-danger">Low Stock</span></td>
                                <td class="text-center">
                                    <button class="btn btn-sm btn-outline-danger" onclick="deleteRow(this)"><i class="bi bi-trash"></i></button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    function updateStock() {
        const nameInput = document.getElementById('materialName');
        const qtyInput = document.getElementById('materialQty');
        const tableBody = document.getElementById('stockTableBody');

        const name = nameInput.value.trim();
        const qty = parseInt(qtyInput.value);

        if (!name || isNaN(qty)) {
            alert("Please enter a valid material and quantity.");
            return;
        }

        let found = false;
        const rows = tableBody.getElementsByTagName('tr');

        for (let row of rows) {
            const resourceName = row.cells[0].innerText;
            if (resourceName.toLowerCase() === name.toLowerCase()) {
                let currentStock = parseInt(row.cells[1].innerText);
                let newStock = currentStock + qty;
                row.cells[1].innerText = newStock;
                updateBadge(row.cells[2].querySelector('.badge'), newStock);
                found = true;
                break;
            }
        }

        if (!found) {
            const newRow = tableBody.insertRow();
            newRow.innerHTML = `
                <td>${name}</td>
                <td>${qty}</td>
                <td><span class="badge ${qty > 50 ? 'bg-success' : 'bg-danger'}">${qty > 50 ? 'Healthy' : 'Low Stock'}</span></td>
                <td class="text-center">
                    <button class="btn btn-sm btn-outline-danger" onclick="deleteRow(this)"><i class="bi bi-trash"></i></button>
                </td>
            `;
        }

        addLog(`Added ${qty} to ${name}`, 'text-dark');
        nameInput.value = "";
        qtyInput.value = "1";
    }

    function deleteRow(btn) {
        if (confirm("Remove this resource from inventory?")) {
            const row = btn.closest('tr');
            const name = row.cells[0].innerText;
            addLog(`Deleted resource: ${name}`, 'text-danger');
            row.remove();
        }
    }

    function updateBadge(badge, stock) {
        if (stock > 50) {
            badge.className = "badge bg-success";
            badge.innerText = "Healthy";
        } else {
            badge.className = "badge bg-danger";
            badge.innerText = "Low Stock";
        }
    }

    function addLog(message, textColor) {
        const log = document.getElementById('activityLog');
        const timestamp = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        if (log.innerText === "No recent updates.") log.innerHTML = "";
        
        const entry = document.createElement('div');
        entry.className = `log-entry ${textColor}`;
        entry.innerHTML = `<strong>${timestamp}:</strong> ${message}`;
        log.prepend(entry);
    }

    function filterStock() {
        const filter = document.getElementById('stockSearch').value.toLowerCase();
        const rows = document.getElementById('stockTableBody').getElementsByTagName('tr');
        for (let row of rows) {
            const text = row.cells[0].innerText.toLowerCase();
            row.style.display = text.includes(filter) ? "" : "none";
        }
    }
</script>

</body>
</html>
