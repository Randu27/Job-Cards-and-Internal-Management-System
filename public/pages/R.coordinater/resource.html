<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resource Coordination - Grafix Print Hub</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../../css/menu.css">

    <style>
        :root {
            --primary-color: #ffe785;
            --secondary-color: #fdfcf0;
            --dark-bg: #2c3e50;
        }

        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* ── Navbar ── */
        .navbar { background-color: var(--primary-color); }
        .navbar-brand { color: #000 !important; font-weight: 700; }
        .bi-list { color: #000 !important; }
        .offcanvas { background-color: var(--primary-color); width: 280px !important; }
        .nav-link { color: #000; padding: 15px 20px; transition: 0.3s; text-decoration: none; display: block; }
        .nav-link:hover, .nav-link.active { color: #fff !important; background: #34495e; }

        /* ── Hero ── */
        .hero-section {
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
            color: white;
            padding: 20px 0;
        }

        /* ── Cards ── */
        .feature-card {
            border: none;
            border-radius: 15px;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .feature-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 24px rgba(0,0,0,0.12);
        }

        /* ── Badges ── */
        .badge {
            padding: 8px 12px;
            border-radius: 6px;
            font-weight: 500;
        }

        /* ── Buttons ── */
        .btn-dark {
            background-color: var(--dark-bg);
            border: none;
        }
        .btn-dark:hover { background-color: #1a252f; }

        /* ── Activity Log ── */
        #activityLog {
            max-height: 250px;
            overflow-y: auto;
            padding-right: 5px;
        }
        #activityLog::-webkit-scrollbar { width: 5px; }
        #activityLog::-webkit-scrollbar-thumb { background: #ccc; border-radius: 10px; }
        .log-entry { padding: 5px 0; border-bottom: 1px solid #eee; font-size: 0.85rem; }

        /* ── Row highlight animation ── */
        @keyframes highlightUpdate {
            0%   { background-color: rgba(255, 231, 133, 0.6); }
            100% { background-color: transparent; }
        }
        .updated-row { animation: highlightUpdate 1.5s ease-out; }

        /* ── Loading spinner overlay ── */
        #loadingOverlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(255,255,255,0.6);
            z-index: 9999;
            align-items: center;
            justify-content: center;
        }
        #loadingOverlay.show { display: flex; }

        /* ── Logout modal ── */
        .modal-overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.5);
            display: flex; align-items: center; justify-content: center;
            z-index: 1050;
        }
        .modal-box {
            background: #fff; border-radius: 12px;
            padding: 30px; max-width: 350px; width: 90%; text-align: center;
        }
        .modal-btn-confirm-red {
            background: #dc3545; color: #fff;
            border: none; border-radius: 8px;
            padding: 8px 20px; margin-right: 8px; cursor: pointer;
        }
        .modal-btn-cancel {
            background: #6c757d; color: #fff;
            border: none; border-radius: 8px;
            padding: 8px 20px; cursor: pointer;
        }
    </style>
</head>
<body>

<!-- ───── Navbar ───── -->
<nav class="navbar navbar-dark shadow-sm sticky-top">
    <div class="container">
        <div class="d-flex align-items-center">
            <button class="btn btn-outline-dark me-3" type="button"
                    data-bs-toggle="offcanvas" data-bs-target="#sidebarMenu">
                <i class="bi bi-list fs-4"></i>
            </button>
            <a class="navbar-brand d-flex align-items-center" href="#">
                <img src="../../assets/logo.png" alt="Logo" height="65" class="me-2">
                Grafix Print Hub
            </a>
        </div>
    </div>
</nav>

<div class="offcanvas offcanvas-start" tabindex="-1" id="sidebarMenu"></div>

<!-- Logout Modal -->
<div id="logoutModal" class="modal-overlay" style="display:none;">
    <div class="modal-box">
        <h5>Confirm Logout</h5>
        <p>Are you sure you want to leave?</p>
        <button onclick="logout()" class="modal-btn-confirm-red">Logout</button>
        <button onclick="closeLogoutModal()" class="modal-btn-cancel">Cancel</button>
    </div>
</div>

<!-- Loading overlay -->
<div id="loadingOverlay">
    <div class="spinner-border text-dark" role="status">
        <span class="visually-hidden">Loading…</span>
    </div>
</div>

<!-- ───── Main ───── -->
<main>
    <div class="hero-section text-center mb-4 shadow">
        <h1 class="fw-bold">Resource Coordination</h1>
        <p class="mb-0 opacity-75" id="syncStatus">
            <i class="bi bi-cloud-check me-1"></i>Connected to Firebase
        </p>
    </div>

    <div class="container mt-4">
        <div class="row g-4">

            <!-- Left column: form + log -->
            <div class="col-md-4">
                <div class="card feature-card shadow-sm p-4">
                    <h4 class="mb-3">Update Stock</h4>
                    <div class="mb-3">
                        <label class="form-label">Material Name</label>
                        <input type="text" id="materialName" class="form-control"
                               placeholder="e.g. Cyan Ink">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Quantity to Add</label>
                        <input type="number" id="materialQty" class="form-control" value="1" min="1">
                    </div>
                    <button class="btn btn-dark w-100" onclick="updateStock()">
                        <i class="bi bi-plus-circle me-2"></i>Update Stock
                    </button>
                </div>

                <div class="card feature-card shadow-sm p-4 mt-4">
                    <h4 class="mb-3">Recent Activity</h4>
                    <div id="activityLog" class="small text-muted">
                        <div class="log-entry">No recent updates.</div>
                    </div>
                </div>
            </div>

            <!-- Right column: table -->
            <div class="col-md-8">
                <div class="card feature-card shadow-sm p-4">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h4 class="m-0">Current Stock</h4>
                        <input type="text" id="stockSearch" class="form-control form-control-sm w-50"
                               placeholder="Search resources…" onkeyup="filterStock()">
                    </div>
                    <table class="table align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>Resource</th>
                                <th>Stock</th>
                                <th>Status</th>
                                <th class="text-center">Action</th>
                            </tr>
                        </thead>
                        <tbody id="stockTableBody">
                            <tr>
                                <td colspan="4" class="text-center text-muted py-4">
                                    <div class="spinner-border spinner-border-sm me-2"></div>
                                    Loading from Firebase…
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>
</main>

<!-- ───── Scripts ───── -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- Firebase SDKs (compat) -->
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-storage-compat.js"></script>

<!-- Your existing config & helpers -->
<script src="../../js/firebase-config.js"></script>
<script src="../../js/navbar-loader.js"></script>
<script src="../../js/signin.js"></script>

<script>
/* ================================================================
   Resource Coordination – Firestore-backed inventory manager
   Collection: "stock"
   ================================================================ */

const COLLECTION = "stock";
let stockDB;   // renamed to avoid conflict with any global `db` in other scripts

/* ── Helpers ── */
function showLoading(show) {
    document.getElementById('loadingOverlay').classList.toggle('show', show);
}

function statusBadge(qty) {
    return qty > 50
        ? `<span class="badge bg-success">Healthy</span>`
        : `<span class="badge bg-danger">Low Stock</span>`;
}

function addLog(message, textColor = 'text-dark') {
    const log = document.getElementById('activityLog');
    if (log.innerText.includes("No recent updates")) log.innerHTML = "";
    const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    const entry = document.createElement('div');
    entry.className = `log-entry ${textColor}`;
    entry.innerHTML = `<strong>${time}</strong>: ${message}`;
    log.prepend(entry);
}

/* ── Render table from Firestore snapshot ── */
function renderTable(docs) {
    const tbody = document.getElementById('stockTableBody');
    tbody.innerHTML = '';

    if (docs.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" class="text-center text-muted py-4">
            No stock items yet. Add one above!</td></tr>`;
        return;
    }

    docs.forEach(doc => {
        const { name, qty } = doc.data();
        const row = document.createElement('tr');
        row.dataset.id   = doc.id;
        row.dataset.name = name;
        row.innerHTML = `
            <td class="fw-semibold">${name}</td>
            <td>${qty}</td>
            <td>${statusBadge(qty)}</td>
            <td class="text-center">
                <button class="btn btn-sm btn-outline-danger" onclick="deleteItem('${doc.id}', '${name}')">
                    <i class="bi bi-trash"></i>
                </button>
            </td>`;
        tbody.appendChild(row);
    });
}

/* ── Real-time listener – keeps table in sync automatically ── */
function startRealtimeListener() {
    stockDB.collection(COLLECTION)
      .orderBy("name")
      .onSnapshot(
          snapshot => {
              renderTable(snapshot.docs);
              document.getElementById('syncStatus').innerHTML =
                  `<i class="bi bi-cloud-check me-1"></i>Synced with Firebase`;
          },
          error => {
              console.error("Firestore listener error:", error);
              document.getElementById('syncStatus').innerHTML =
                  `<i class="bi bi-cloud-slash me-1 text-warning"></i>Sync error – check console`;
          }
      );
}

/* ── Add / Update stock ── */
async function updateStock() {
    const nameInput = document.getElementById('materialName');
    const qtyInput  = document.getElementById('materialQty');
    const name = nameInput.value.trim();
    const qty  = parseInt(qtyInput.value);

    if (!name || isNaN(qty) || qty < 1) {
        alert("Please enter a valid material name and a positive quantity.");
        return;
    }

    showLoading(true);
    try {
        // Search for existing document with the same name (case-insensitive)
        const snapshot = await stockDB.collection(COLLECTION)
            .where("nameLower", "==", name.toLowerCase())
            .get();

        if (!snapshot.empty) {
            const docRef = snapshot.docs[0].ref;
            const currentQty = snapshot.docs[0].data().qty;
            await docRef.update({
                qty: currentQty + qty,
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            });
            addLog(`Stock increased: ${name} (+${qty})`, 'text-primary');

            const row = document.querySelector(`tr[data-name="${name}"]`);
            if (row) {
                row.classList.remove('updated-row');
                void row.offsetWidth;
                row.classList.add('updated-row');
            }
        } else {
            await stockDB.collection(COLLECTION).add({
                name:       name,
                nameLower:  name.toLowerCase(),   // for case-insensitive lookup
                qty:        qty,
                updatedAt:  firebase.firestore.FieldValue.serverTimestamp()
            });
            addLog(`New resource added: ${name} (${qty})`, 'text-success');
        }

        nameInput.value = "";
        qtyInput.value  = "1";
    } catch (err) {
        console.error("updateStock error:", err);
        alert("Failed to update stock. Check console for details.");
    } finally {
        showLoading(false);
    }
}

/* ── Delete a stock item ── */
async function deleteItem(docId, name) {
    if (!confirm(`Remove "${name}" from inventory?`)) return;

    showLoading(true);
    try {
        await stockDB.collection(COLLECTION).doc(docId).delete();
        addLog(`Removed: ${name}`, 'text-danger');
    } catch (err) {
        console.error("deleteItem error:", err);
        alert("Failed to delete item. Check console for details.");
    } finally {
        showLoading(false);
    }
}

/* ── Search filter (client-side, works on rendered rows) ── */
function filterStock() {
    const term = document.getElementById('stockSearch').value.toLowerCase();
    document.querySelectorAll('#stockTableBody tr').forEach(row => {
        const name = (row.dataset.name || "").toLowerCase();
        row.style.display = name.includes(term) ? '' : 'none';
    });
}

/* ── Bootstrap: wait for firebase-config.js to expose `firebase` ── */
document.addEventListener('DOMContentLoaded', () => {
    // firebase-config.js should call firebase.initializeApp(firebaseConfig)
    // We just grab the Firestore instance from the already-initialized app.
    try {
        stockDB = firebase.firestore();
        startRealtimeListener();
    } catch (e) {
        console.error("Firebase not initialized. Make sure firebase-config.js runs first.", e);
        document.getElementById('syncStatus').innerHTML =
            `<i class="bi bi-exclamation-triangle me-1 text-warning"></i>Firebase not configured`;
        document.getElementById('stockTableBody').innerHTML =
            `<tr><td colspan="4" class="text-center text-danger py-3">
                Firebase config error – check firebase-config.js</td></tr>`;
    }
});
</script>

</body>
</html>
