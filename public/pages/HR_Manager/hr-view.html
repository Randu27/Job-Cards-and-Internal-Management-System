<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Employee Directory | Grafix Print Hub</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../../css/hr-style.css">
  <link rel="stylesheet" href="../../css/menu.css">
  <style>
    :root {
      --dir-accent: #4f46e5; --dir-accent-soft: #eef2ff;
      --dir-danger: #dc2626; --dir-success: #16a34a; --dir-warn: #d97706;
      --card-radius: 14px; --transition: .22s cubic-bezier(.4,0,.2,1);
    }

    .search-wrap { position: relative; }
    .search-wrap .bi-search { position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#9ca3af;font-size:1.1rem;pointer-events:none; }
    #dirSearch { padding-left:40px;border-radius:10px;border:1.5px solid #d1d5db;font-size:.97rem;transition:border-color var(--transition),box-shadow var(--transition); }
    #dirSearch:focus { border-color:var(--dir-accent);box-shadow:0 0 0 3px rgba(79,70,229,.15);outline:none; }

    .filter-select { border-radius:10px;border:1.5px solid #d1d5db;font-size:.92rem;transition:border-color var(--transition);cursor:pointer; }
    .filter-select:focus { border-color:var(--dir-accent);box-shadow:0 0 0 3px rgba(79,70,229,.13);outline:none; }

    #resultCount { font-size:1rem;color:#6b7280;display:flex;align-items:center;gap:6px; }
    #resultCount span { font-weight:700;color:var(--dir-accent); }

    .emp-card { background:#fff;border:1.5px solid #e5e7eb;border-radius:var(--card-radius);padding:18px;display:flex;align-items:center;gap:16px;cursor:pointer;transition:box-shadow var(--transition),border-color var(--transition),transform var(--transition);position:relative;overflow:hidden; }
    .emp-card::before { content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--dir-accent);opacity:0;transition:opacity var(--transition);border-radius:4px 0 0 4px; }
    .emp-card:hover { box-shadow:0 6px 24px rgba(79,70,229,.12);border-color:var(--dir-accent);transform:translateY(-2px); }
    .emp-card:hover::before { opacity:1; }

    .emp-avatar { width:54px;height:54px;border-radius:50%;object-fit:cover;border:2.5px solid #e5e7eb;flex-shrink:0;background:#f3f4f6; }
    .emp-avatar-placeholder { width:54px;height:54px;border-radius:50%;background:var(--dir-accent-soft);display:flex;align-items:center;justify-content:center;font-size:1.4rem;font-weight:700;color:var(--dir-accent);border:2.5px solid #c7d2fe;flex-shrink:0; }
    .emp-card-info { flex:1;min-width:0; }
    .emp-card-name { font-weight:700;font-size:1rem;color:#111827;white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }
    .emp-card-meta { font-size:.82rem;color:#6b7280;margin-top:2px; }
    .emp-card-meta span { margin-right:10px; }

    .badge-status { font-size:.74rem;font-weight:600;padding:3px 10px;border-radius:20px; }
    .badge-fulltime { background:#dcfce7;color:#15803d; }
    .badge-parttime { background:#fef9c3;color:#a16207; }

    .empty-state { text-align:center;padding:60px 20px;color:#9ca3af; }
    .empty-state i { font-size:3rem;margin-bottom:12px;display:block; }
    .empty-state p { margin:0;font-size:1rem; }

    .skeleton-card { background:#fff;border:1.5px solid #e5e7eb;border-radius:var(--card-radius);padding:18px;display:flex;align-items:center;gap:16px;animation:pulse 1.5s infinite; }
    .sk-circle { width:54px;height:54px;border-radius:50%;background:#e5e7eb;flex-shrink:0; }
    .sk-lines { flex:1; }
    .sk-line { height:12px;background:#e5e7eb;border-radius:6px;margin-bottom:8px; }
    .sk-line.short { width:60%; }
    @keyframes pulse { 0%,100%{opacity:1}50%{opacity:.5} }

    /* Modal Styles - kept your original */
    .modal-backdrop-custom { position:fixed;inset:0;background:rgba(0,0,0,.45);backdrop-filter:blur(3px);z-index:1050;display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeIn .2s ease; }
    @keyframes fadeIn { from{opacity:0}to{opacity:1} }

    .dir-modal { background:#fff;border-radius:20px;width:100%;max-width:700px;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 25px 60px rgba(0,0,0,.25);animation:slideUp .25s cubic-bezier(.34,1.56,.64,1);overflow:hidden; }
    @keyframes slideUp { from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)} }

    .dir-modal-header { background:#ffe785;border-radius:20px 20px 0 0;padding:28px 28px 24px;color:rgb(87,86,86);display:flex;gap:20px;align-items:flex-start;position:relative;flex-shrink:0; }
    .dir-modal-avatar { width:84px;height:84px;border-radius:50%;object-fit:cover;border:3px solid rgba(255,255,255,.5);flex-shrink:0; }
    .dir-modal-avatar-ph { width:84px;height:84px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:2rem;font-weight:800;color:#fff;border:3px solid rgba(255,255,255,.4);flex-shrink:0; }
    .dir-modal-title { font-size:1.4rem;font-weight:800;margin:0; }
    .dir-modal-sub { font-size:.9rem;opacity:.85;margin-top:4px; }

    .btn-modal-close { position:absolute;top:16px;right:16px;background:rgba(255,255,255,.2);border:none;border-radius:8px;color:#fff;width:34px;height:34px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background var(--transition); }
    .btn-modal-close:hover { background:rgba(255,255,255,.35); }

    .dir-modal-body { padding:24px 24px 0;overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch;scroll-behavior:smooth; }

    /* ... rest of your modal styles (I kept them all) ... */
    /* (Your long style block for modal, edit, pas-edit, etc. is kept as is) */
  </style>
</head>

    <div class="container">
      <div class="d-flex align-items-center">
        <button class="btn btn-outline-light me-3" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebarMenu">
          <i class="bi bi-list fs-4"></i>
        </button>
        <a class="navbar-brand d-flex align-items-center" href="#">
          <img src="../../assets/logo.png" alt="Logo" height="65" class="me-2">
          Grafix Print Hub
        </a>
      </div>
    </div>
  </nav>

  <div class="offcanvas offcanvas-start" tabindex="-1" id="sidebarMenu"></div>

  <div id="logoutModal" class="modal-overlay" style="display:none;">
    <div class="modal-box">
      <h5>Confirm Logout</h5>
      <p>Are you sure you want to leave?</p>
      <button onclick="logout()" class="modal-btn-confirm-red">Logout</button>
      <button onclick="closeLogoutModal()" class="modal-btn-cancel">Cancel</button>
    </div>
  </div>

  <div class="hero-section">
    <div class="container text-center"><h1 class="display-4">Employee Directory</h1></div>
  </div>

  <div class="container mt-3">
    <a href="hr-index.html" class="btn btn-outline-secondary back-btn">
      <i class="bi bi
