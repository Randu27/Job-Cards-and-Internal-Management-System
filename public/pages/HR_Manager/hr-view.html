<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Employee Directory | Grafix Print Hub</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../../css/hr-style.css">
  <link rel="stylesheet" href="../../css/hr-view.css">
  <link rel="stylesheet" href="../../css/menu.css">
  
</head>

<body>

  <nav class="navbar navbar-dark shadow-sm sticky-top">
    <div class="container">
      <div class="d-flex align-items-center">
        <button class="btn btn-outline-light me-3" type="button" data-bs-toggle="offcanvas"
          data-bs-target="#sidebarMenu">
          <i class="bi bi-list fs-4"></i>
        </button>
        <a class="navbar-brand d-flex align-items-center" href="#">
          <img src="../../assets/logo.png" alt="Logo" height="65" class="me-2">
          Grafix Print Hub
        </a>
      </div>
    </div>
  </nav>

  <div class="offcanvas offcanvas-start" tabindex="-1" id="sidebarMenu"></div>

  <div id="logoutModal" class="modal-overlay" style="display:none;">
    <div class="modal-box">
      <h5>Confirm Logout</h5>
      <p>Are you sure you want to leave?</p>
      <button onclick="logout()" class="modal-btn-confirm-red">Logout</button>
      <button onclick="closeLogoutModal()" class="modal-btn-cancel">Cancel</button>
    </div>
  </div>

  <div class="hero-section">
    <div class="container text-center">
      <h1 class="display-4">Employee Directory</h1>
    </div>
  </div>

  <div class="container mt-3">
    <a href="hr-index.html" class="btn btn-outline-secondary back-btn">
      <i class="bi bi-arrow-left"></i> Back to Dashboard
    </a>
  </div>

  <!-- Search + Filters -->
  <div class="container mt-4">
  <div class="filter-row">
    <div class="search-col">
      <div class="search-wrap">
        <i class="bi bi-search"></i>
        <input type="text" id="dirSearch" class="form-control" placeholder="Search by name, ID, email…">
      </div>
    </div>
    <div class="filter-col">
      <select id="filterDept" class="form-select filter-select">
        <option value="">All Departments</option>
        <option value="Front Office">Front Office</option>
        <option value="Workshop">Workshop</option>
      </select>
    </div>
    <div class="filter-col">
      <select id="filterStatus" class="form-select filter-select">
        <option value="">All Status</option>
        <option value="Full Time">Full Time</option>
        <option value="Part Time">Part Time</option>
      </select>
    </div>
    <div class="count-col">
      <div id="resultCount"><i class="bi bi-people"></i> <span id="countNum">0</span> employees</div>
    </div>
  </div>
</div>

  <!-- Directory List -->
  <div class="container mt-4 mb-5">
    <div id="dirList" class="row g-3"></div>
  </div>

  <footer class="text-center text-muted mt-5 py-3">
    <small>&copy; Grafix Print Hub</small>
  </footer>

  <!--DETAIL / EDIT MODAL -->
  <div id="empModal" class="modal-backdrop-custom" style="display:none;" onclick="handleModalBgClick(event)">
    <div class="dir-modal" onclick="event.stopPropagation()">

      <!-- Header -->
      <div class="dir-modal-header">
        <div id="modalAvatarWrap"></div>
        <div style="flex:1;min-width:0;">
          <div class="dir-modal-title" id="modalName">—</div>
          <div class="dir-modal-sub" id="modalSub">—</div>
        </div>
        <button class="btn-modal-close" onclick="closeModal()"><i class="bi bi-x-lg"></i></button>
      </div>

      <!--  VIEW SECTION  -->
      <div class="dir-modal-body view-section" id="viewSection">
        <div class="detail-grid" id="detailGrid"></div>
        <div style="height:8px;"></div>
      </div>

      <!--  EDIT SECTION  -->
      <div class="dir-modal-body edit-section" id="editSection">

        <!-- Photo -->
        <div class="photo-update-row">
          <img id="editPhotoPreview" class="photo-update-preview" src="">
          <div>
            <label style="font-size:.82rem;font-weight:600;color:#374151;display:block;margin-bottom:4px;">Update Photo
              (Optional)</label>
            <input type="file" id="editPhotoInput" class="form-control form-control-sm" accept="image/*"
              style="max-width:220px;">
          </div>
        </div>

        <!-- Personal -->
        <div class="form-section-label">Personal Details</div>
        <div class="edit-form-grid">
          <div><label>Employee Name</label><input type="text" id="editName"></div>
          <div><label>Employee ID</label><input type="text" id="editEmpId" disabled></div>
          <div>
            <label>Status</label>
            <select id="editStatus">
              <option value="Full Time">Full Time</option>
              <option value="Part Time">Part Time</option>
            </select>
          </div>
          <div>
            <label>Department</label>
            <select id="editDept">
              <option value="Front Office">Front Office</option>
              <option value="Workshop">Workshop</option>
            </select>
          </div>
          <div><label>Date Joined</label><input type="date" id="editJoinDate"></div>
          <div><label>NIC</label><input type="text" id="editNic"></div>
          <div class="full-col"><label>Address</label><input type="text" id="editAddress"></div>
        </div>

        <!-- Contact -->
        <div class="form-section-label">Contact</div>
        <div class="edit-form-grid">
          <div><label>Email</label><input type="email" id="editEmail"></div>
          <div><label>Contact Number</label><input type="text" id="editContact"></div>
        </div>

        <!-- Remarks -->
        <div class="form-section-label">Remarks</div>
        <div class="edit-form-grid">
          <div class="full-col"><label>Remarks</label><textarea id="editRemarks" rows="3"></textarea></div>
        </div>

        <!--  WEBSITE ACCESS EDIT -->
        <div class="form-section-label">Website Access</div>
        <div class="edit-form-grid">
          <div class="full-col">
            <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;">
              <input class="form-check-input" type="checkbox" id="editHasAccess"
                style="width:18px;height:18px;cursor:pointer;" onchange="toggleEditAccessSection(this)">
              <label for="editHasAccess"
                style="font-size:.88rem;font-weight:600;color:#374151;cursor:pointer;margin:0;">
                Give / Keep Website Access
              </label>
            </div>

            <div id="editAccessSection" class="access-edit-block" style="display:none;">
              <label>Job Role</label>
              <select id="editJobRole">
                <option value="" disabled>Select Role</option>
                <option value="financial_manager">Receptionist</option>
                <option value="resource_manager">Front Office Manager</option>
                <option value="customer_manager">Shop Keeper</option>
              </select>

              <label>Login Email</label>
              <input type="email" id="editLoginEmail" placeholder="login@example.com">

              <label>Login Password <span style="font-weight:400;font-size:.7rem;color:#9ca3af;">(leave blank to keep
                  existing)</span></label>
              <div class="input-group" style="margin-bottom:10px;">
                <input type="password" id="editLoginPassword" class="form-control"
                  placeholder="New password (min. 6 chars)">
                <button class="btn btn-outline-secondary" type="button" id="editTogglePasswordBtn" tabindex="-1">
                  <i class="bi bi-eye-slash" id="editToggleIcon"></i>
                </button>
              </div>

              <!-- Page Access in Edit Modal (NEW) -->
              <div class="pas-edit-title">
                <i class="bi bi-grid-3x3-gap"></i> Page Access
              </div>

              <div class="pas-edit-grid" id="editPageAccessGrid">

                <label class="pas-edit-item" for="epa_om">
                  <input class="pas-edit-check" type="checkbox" id="epa_om" value="order_management"
                    onchange="updateEditPasCount()">
                  <div class="pas-edit-tick"><i class="bi bi-check-lg"></i></div>
                  <div class="pas-edit-icon"><i class="bi bi-clipboard-check"></i></div>
                  <div class="pas-edit-label">Order Management</div>
                </label>

                <label class="pas-edit-item" for="epa_crm">
                  <input class="pas-edit-check" type="checkbox" id="epa_crm" value="crm"
                    onchange="updateEditPasCount()">
                  <div class="pas-edit-tick"><i class="bi bi-check-lg"></i></div>
                  <div class="pas-edit-icon"><i class="bi bi-people"></i></div>
                  <div class="pas-edit-label">CRM</div>
                </label>

                <label class="pas-edit-item" for="epa_fin">
                  <input class="pas-edit-check" type="checkbox" id="epa_fin" value="financial_management"
                    onchange="updateEditPasCount()">
                  <div class="pas-edit-tick"><i class="bi bi-check-lg"></i></div>
                  <div class="pas-edit-icon"><i class="bi bi-cash-coin"></i></div>
                  <div class="pas-edit-label">Financial Management</div>
                </label>

                <label class="pas-edit-item" for="epa_hr">
                  <input class="pas-edit-check" type="checkbox" id="epa_hr" value="human_resources"
                    onchange="updateEditPasCount()">
                  <div class="pas-edit-tick"><i class="bi bi-check-lg"></i></div>
                  <div class="pas-edit-icon"><i class="bi bi-person-badge"></i></div>
                  <div class="pas-edit-label">Human Resources</div>
                </label>

                <label class="pas-edit-item" for="epa_rc">
                  <input class="pas-edit-check" type="checkbox" id="epa_rc" value="resource_coordinator"
                    onchange="updateEditPasCount()">
                  <div class="pas-edit-tick"><i class="bi bi-check-lg"></i></div>
                  <div class="pas-edit-icon"><i class="bi bi-boxes"></i></div>
                  <div class="pas-edit-label">Resource Coordinator</div>
                </label>

              </div>

              <!-- /pas-edit-grid -->
              <div class="pas-edit-footer">
                <button type="button" class="pas-edit-btn" onclick="editPasAll(true)">Select all</button>
                <button type="button" class="pas-edit-btn" onclick="editPasAll(false)">Clear all</button>
                <div class="pas-edit-count"><b id="editPasCountNum">0</b> of 5 selected</div>
              </div>
             

            </div>
          </div>
        </div>
      

        <div style="height:8px;"></div>
      </div><!-- end edit-section -->

      <!-- Delete confirm -->
      <div class="delete-confirm-box" id="deleteConfirmBox">
        <p><i class="bi bi-exclamation-triangle-fill me-2"></i>Are you sure you want to delete <strong
            id="deleteNameLabel"></strong>? This cannot be undone.</p>
        <div class="d-flex gap-2 justify-content-center">
          <button class="btn btn-sm btn-danger" id="confirmDeleteBtn" onclick="confirmDelete()">Yes, Delete</button>
          <button class="btn btn-sm btn-secondary" onclick="cancelDelete()">Cancel</button>
        </div>
      </div>

      <!-- Action buttons -->
      <div class="dir-modal-actions">
        <button class="btn btn-edit" id="btnEdit" onclick="enterEditMode()"><i
            class="bi bi-pencil me-1"></i>Edit</button>
        <button class="btn btn-warning" id="btnResetPassword" onclick="resetEmployeePassword()" style="display:none;">
          <i class="bi bi-key me-1"></i>Reset Password
        </button>
        <button class="btn btn-save" id="btnSave" onclick="saveEmployee()" style="display:none;"><i
            class="bi bi-check-lg me-1"></i>Save Changes</button>
        <button class="btn btn-cancel-edit" id="btnCancelEdit" onclick="cancelEditMode()" style="display:none;"><i
            class="bi bi-x me-1"></i>Cancel</button>
        <button class="btn btn-delete" id="btnDelete" onclick="promptDelete()"><i
            class="bi bi-trash me-1"></i>Delete</button>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>

  <!-- Bootstrap -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-storage-compat.js"></script>
  <script src="../../js/firebase-config.js"></script>
  <script src="../../js/hr-script.js"></script>
  <script src="../../js/navbar-loader.js"></script>
  <script src="../../js/signin.js"></script>

  <script>
    // ── Edit modal: access section toggle ────────────────────────────────────
    function toggleEditAccessSection(cb) {
      document.getElementById('editAccessSection').style.display = cb.checked ? 'block' : 'none';
      if (!cb.checked) editPasAll(false);
    }

    // ── Edit password eye toggle ──────────────────────────────────────────────
    document.getElementById('editTogglePasswordBtn').addEventListener('click', function () {
      const inp = document.getElementById('editLoginPassword');
      const ico = document.getElementById('editToggleIcon');
      inp.type = inp.type === 'password' ? 'text' : 'password';
      ico.className = inp.type === 'password' ? 'bi bi-eye-slash' : 'bi bi-eye';
    });

    // ── Page access helpers (edit modal) ─────────────────────────────────────
    function updateEditPasCount() {
      const n = document.querySelectorAll('#editPageAccessGrid .pas-edit-check:checked').length;
      document.getElementById('editPasCountNum').textContent = n;
    }

    function editPasAll(checked) {
      document.querySelectorAll('#editPageAccessGrid .pas-edit-check').forEach(c => c.checked = checked);
      updateEditPasCount();
    }

    // Called by hr-script.js when populating the edit form for a selected employee.
    // Pass the employee's existing grantedPages array to pre-tick the checkboxes.
    window.populateEditPageAccess = function (grantedPages) {
      document.querySelectorAll('#editPageAccessGrid .pas-edit-check').forEach(c => {
        c.checked = Array.isArray(grantedPages) && grantedPages.includes(c.value);
      });
      updateEditPasCount();
    };

    // Called by hr-script.js saveEmployee() to get the chosen pages for Firestore.
    window.getEditSelectedPages = function () {
      return Array.from(document.querySelectorAll('#editPageAccessGrid .pas-edit-check:checked'))
        .map(c => c.value);
    };

    // ── Owner-only guard ──────────────────────────────────────────────────────
    document.addEventListener('DOMContentLoaded', () => {
      const role = sessionStorage.getItem('userRole');
      if (role && role !== 'order_manager') {
        window.location.href = '../../auth/login/access-denied.html';
      }
    });
  </script>

</body>

</html>
