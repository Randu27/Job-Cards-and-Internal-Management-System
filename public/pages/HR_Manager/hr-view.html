<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Employee Directory | Grafix Print Hub</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../../css/hr-style.css">
  <link rel="stylesheet" href="../../css/menu.css">
  <style>
    :root {
      --dir-accent: #4f46e5; --dir-accent-soft: #eef2ff;
      --dir-danger: #dc2626; --dir-success: #16a34a; --dir-warn: #d97706;
      --card-radius: 14px; --transition: .22s cubic-bezier(.4,0,.2,1);
    }
 
    .search-wrap { position: relative; }
    .search-wrap .bi-search { position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#9ca3af;font-size:1.1rem;pointer-events:none; }
    #dirSearch { padding-left:40px;border-radius:10px;border:1.5px solid #d1d5db;font-size:.97rem;transition:border-color var(--transition),box-shadow var(--transition); }
    #dirSearch:focus { border-color:var(--dir-accent);box-shadow:0 0 0 3px rgba(79,70,229,.15);outline:none; }
 
    .filter-select { border-radius:10px;border:1.5px solid #d1d5db;font-size:.92rem;transition:border-color var(--transition);cursor:pointer; }
    .filter-select:focus { border-color:var(--dir-accent);box-shadow:0 0 0 3px rgba(79,70,229,.13);outline:none; }
 
    #resultCount { font-size:1rem;color:#6b7280;display:flex;align-items:center;gap:6px; }
    #resultCount span { font-weight:700;color:var(--dir-accent); }
 
    .emp-card { background:#fff;border:1.5px solid #e5e7eb;border-radius:var(--card-radius);padding:18px;display:flex;align-items:center;gap:16px;cursor:pointer;transition:box-shadow var(--transition),border-color var(--transition),transform var(--transition);position:relative;overflow:hidden; }
    .emp-card::before { content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--dir-accent);opacity:0;transition:opacity var(--transition);border-radius:4px 0 0 4px; }
    .emp-card:hover { box-shadow:0 6px 24px rgba(79,70,229,.12);border-color:var(--dir-accent);transform:translateY(-2px); }
    .emp-card:hover::before { opacity:1; }
 
    .emp-avatar { width:54px;height:54px;border-radius:50%;object-fit:cover;border:2.5px solid #e5e7eb;flex-shrink:0;background:#f3f4f6; }
    .emp-avatar-placeholder { width:54px;height:54px;border-radius:50%;background:var(--dir-accent-soft);display:flex;align-items:center;justify-content:center;font-size:1.4rem;font-weight:700;color:var(--dir-accent);border:2.5px solid #c7d2fe;flex-shrink:0; }
    .emp-card-info { flex:1;min-width:0; }
    .emp-card-name { font-weight:700;font-size:1rem;color:#111827;white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }
    .emp-card-meta { font-size:.82rem;color:#6b7280;margin-top:2px; }
    .emp-card-meta span { margin-right:10px; }
 
    .badge-status { font-size:.74rem;font-weight:600;padding:3px 10px;border-radius:20px; }
    .badge-fulltime { background:#dcfce7;color:#15803d; }
    .badge-parttime { background:#fef9c3;color:#a16207; }
 
    .empty-state { text-align:center;padding:60px 20px;color:#9ca3af; }
    .empty-state i { font-size:3rem;margin-bottom:12px;display:block; }
    .empty-state p { margin:0;font-size:1rem; }
 
    .skeleton-card { background:#fff;border:1.5px solid #e5e7eb;border-radius:var(--card-radius);padding:18px;display:flex;align-items:center;gap:16px;animation:pulse 1.5s infinite; }
    .sk-circle { width:54px;height:54px;border-radius:50%;background:#e5e7eb;flex-shrink:0; }
    .sk-lines { flex:1; }
    .sk-line { height:12px;background:#e5e7eb;border-radius:6px;margin-bottom:8px; }
    .sk-line.short { width:60%; }
    @keyframes pulse { 0%,100%{opacity:1}50%{opacity:.5} }
 
    /* Modal */
    .modal-backdrop-custom { position:fixed;inset:0;background:rgba(0,0,0,.45);backdrop-filter:blur(3px);z-index:1050;display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeIn .2s ease; }
    @keyframes fadeIn { from{opacity:0}to{opacity:1} }
 
    .dir-modal { background:#fff;border-radius:20px;width:100%;max-width:700px;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 25px 60px rgba(0,0,0,.25);animation:slideUp .25s cubic-bezier(.34,1.56,.64,1);overflow:hidden; }
    @keyframes slideUp { from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)} }
 
    .dir-modal-header { background:#ffe785;border-radius:20px 20px 0 0;padding:28px 28px 24px;color:rgb(87,86,86);display:flex;gap:20px;align-items:flex-start;position:relative;flex-shrink:0; }
    .dir-modal-avatar { width:84px;height:84px;border-radius:50%;object-fit:cover;border:3px solid rgba(255,255,255,.5);flex-shrink:0; }
    .dir-modal-avatar-ph { width:84px;height:84px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:2rem;font-weight:800;color:#fff;border:3px solid rgba(255,255,255,.4);flex-shrink:0; }
    .dir-modal-title { font-size:1.4rem;font-weight:800;margin:0; }
    .dir-modal-sub { font-size:.9rem;opacity:.85;margin-top:4px; }
 
    .btn-modal-close { position:absolute;top:16px;right:16px;background:rgba(255,255,255,.2);border:none;border-radius:8px;color:#fff;width:34px;height:34px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background var(--transition); }
    .btn-modal-close:hover { background:rgba(255,255,255,.35); }
 
    .dir-modal-body { padding:24px 24px 0;overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch;scroll-behavior:smooth; }
    .dir-modal-body::-webkit-scrollbar { width:5px; }
    .dir-modal-body::-webkit-scrollbar-track { background:transparent; }
    .dir-modal-body::-webkit-scrollbar-thumb { background:rgba(79,70,229,.25);border-radius:99px; }
    .dir-modal-body::-webkit-scrollbar-thumb:hover { background:rgba(79,70,229,.5); }
 
    .form-section-label { font-size:.68rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:#9ca3af;margin:20px 0 10px;padding-bottom:6px;border-bottom:.5px solid #e5e7eb; }
    .form-section-label:first-child { margin-top:0; }
 
    .view-section { display:block; }
    .view-section.hidden { display:none; }
    .edit-section { display:none; }
    .edit-section.active { display:block; }
 
    .detail-grid { display:grid;grid-template-columns:1fr 1fr;gap:16px; }
    .detail-item label { font-size:.75rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:#9ca3af;display:block;margin-bottom:3px; }
    .detail-item .val { font-size:.95rem;color:#111827;font-weight:500; }
    .detail-item.full { grid-column:1/-1; }
 
    .photo-update-row { display:flex;align-items:center;gap:14px;background:#f9fafb;border:.5px solid #e5e7eb;border-radius:12px;padding:12px 16px;margin-bottom:16px; }
    .photo-update-preview { width:60px;height:60px;border-radius:50%;object-fit:cover;border:2px solid #e5e7eb;flex-shrink:0; }
 
    .edit-form-grid { display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:4px; }
    .edit-form-grid .full-col { grid-column:1/-1; }
    .edit-form-grid label { font-size:.73rem;font-weight:600;color:#6b7280;margin-bottom:4px;display:block;letter-spacing:.03em; }
    .edit-form-grid input,
    .edit-form-grid select,
    .edit-form-grid textarea { width:100%;border:.5px solid #e5e7eb;border-radius:8px;padding:8px 12px;font-size:.9rem;transition:border-color var(--transition),box-shadow var(--transition);outline:none;background:#fff;color:#111827; }
    .edit-form-grid input:focus,
    .edit-form-grid select:focus,
    .edit-form-grid textarea:focus { border-color:var(--dir-accent);box-shadow:0 0 0 3px rgba(79,70,229,.12); }
    .edit-form-grid input:disabled { background:#f9fafb;color:#9ca3af;cursor:not-allowed; }
    .edit-form-grid textarea { resize:vertical;min-height:72px; }
 
    /* Web access edit block */
    .access-edit-block { background:#f0f4ff;border:1px solid #c7d2fe;border-radius:10px;padding:14px 16px;margin-top:4px; }
    .access-edit-block label { font-size:.73rem;font-weight:600;color:#4f46e5;margin-bottom:4px;display:block; }
    .access-edit-block input,
    .access-edit-block select { width:100%;border:1px solid #c7d2fe;border-radius:8px;padding:8px 12px;font-size:.9rem;outline:none;background:#fff;color:#111827;margin-bottom:10px; }
    .access-edit-block input:focus,
    .access-edit-block select:focus { border-color:#4f46e5;box-shadow:0 0 0 3px rgba(79,70,229,.12); }
    .access-edit-block .input-group input { margin-bottom:0; }
    .access-badge-on  { display:inline-block;padding:2px 10px;border-radius:20px;font-size:.72rem;font-weight:700;background:#dcfce7;color:#15803d;margin-left:8px; }
    .access-badge-off { display:inline-block;padding:2px 10px;border-radius:20px;font-size:.72rem;font-weight:700;background:#f1f5f9;color:#64748b;margin-left:8px; }
 
    .dir-modal-actions { background:#fff;border-top:.5px solid #e5e7eb;display:flex;gap:10px;flex-wrap:wrap;padding:14px 28px;flex-shrink:0;align-items:center; }
    .btn-edit   { background:var(--dir-accent);color:#fff; }
    .btn-edit:hover { background:#4338ca;color:#fff; }
    .btn-save   { background:var(--dir-success);color:#fff; }
    .btn-save:hover { background:#15803d;color:#fff; }
    .btn-cancel-edit { background:#f3f4f6;color:#374151; }
    .btn-cancel-edit:hover { background:#e5e7eb; }
    .btn-delete { background:#d23838;color:#fff;margin-left:auto; }
    .btn-delete:hover { background:var(--dir-danger);color:#fff; }
 
    .delete-confirm-box { background:#fff5f5;border:1.5px solid #fecaca;border-radius:12px;padding:18px;text-align:center;display:none;margin:0 0 16px; }
    .delete-confirm-box.active { display:block; }
    .delete-confirm-box p { font-size:.95rem;color:#991b1b;margin-bottom:12px;font-weight:600; }
 
    @media (max-width:575px) {
      .detail-grid,.edit-form-grid { grid-template-columns:1fr; }
      .detail-item.full,.edit-form-grid .full-col { grid-column:auto; }
      .dir-modal-actions { flex-direction:column; }
      .btn-delete { margin-left:0; }
    }
 
    .btn-warning { background:#f59e0b;color:white;border:none; }
    .btn-warning:hover { background:#d97706;color:white; }
 
    /* ── Page access inside edit modal ─────────────────────────────── */
    .pas-edit-title {
      font-size: .7rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: .07em; color: #4f46e5;
      margin: 12px 0 6px; display: flex; align-items: center; gap: 5px;
    }
    .pas-edit-grid {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 0; border: 1px solid #c7d2fe; border-radius: 10px; overflow: hidden;
    }
    .pas-edit-item {
      display: flex; align-items: center; gap: 8px;
      padding: 9px 10px; cursor: pointer;
      border-bottom: 1px solid #e0e7ff; border-right: 1px solid #e0e7ff;
      transition: background .15s;
    }
    .pas-edit-item:nth-child(even)      { border-right: none; }
    .pas-edit-item:nth-last-child(-n+2) { border-bottom: none; }
    .pas-edit-item:last-child           { grid-column: 1 / -1; border-right: none; border-bottom: none; }
    .pas-edit-item:hover                { background: #eef2ff; }
 
    .pas-edit-check { display: none; }
    .pas-edit-tick {
      width: 16px; height: 16px; border-radius: 4px;
      border: 1.5px solid #a5b4fc; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: .58rem; color: transparent;
      background: white; transition: all .15s;
    }
    .pas-edit-icon {
      width: 22px; height: 22px; border-radius: 5px;
      background: #e0e7ff; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: .75rem; color: #4f46e5; transition: background .15s;
    }
    .pas-edit-label { font-size: .76rem; font-weight: 600; color: #1e1b4b; flex: 1; }
 
    .pas-edit-check:checked ~ .pas-edit-tick  { background: #4f46e5; border-color: #4f46e5; color: white; }
    .pas-edit-check:checked ~ .pas-edit-icon  { background: #ffe785; color: #34495e; }
    .pas-edit-item:has(.pas-edit-check:checked) { background: #f5f3ff; }
 
    .pas-edit-footer { display: flex; align-items: center; margin-top: 5px; }
    .pas-edit-btn { background: none; border: none; font-size: .71rem; font-weight: 600;
                    color: #4f46e5; cursor: pointer; text-decoration: underline; padding: 0 8px 0 0; }
    .pas-edit-count { font-size: .7rem; color: #6b7280; margin-left: auto; }
    .pas-edit-count b { color: #4f46e5; }
  </style>
</head>
<body>
 
<nav class="navbar navbar-dark shadow-sm sticky-top">
  <div class="container">
    <div class="d-flex align-items-center">
      <button class="btn btn-outline-light me-3" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebarMenu">
        <i class="bi bi-list fs-4"></i>
      </button>
      <a class="navbar-brand d-flex align-items-center" href="#">
        <img src="../../assets/logo.png" alt="Logo" height="65" class="me-2">
        Grafix Print Hub
      </a>
    </div>
  </div>
</nav>
 
<div class="offcanvas offcanvas-start" tabindex="-1" id="sidebarMenu"></div>
 
<div id="logoutModal" class="modal-overlay" style="display:none;">
  <div class="modal-box">
    <h5>Confirm Logout</h5>
    <p>Are you sure you want to leave?</p>
    <button onclick="logout()" class="modal-btn-confirm-red">Logout</button>
    <button onclick="closeLogoutModal()" class="modal-btn-cancel">Cancel</button>
  </div>
</div>
 
<div class="hero-section">
  <div class="container text-center"><h1 class="display-4">Employee Directory</h1></div>
</div>
 
<div class="container mt-3">
  <a href="hr-index.html" class="btn btn-outline-secondary back-btn">
    <i class="bi bi-arrow-left"></i> Back to Dashboard
  </a>
</div>
 
<!-- Search + Filters -->
<div class="container mt-4">
  <div class="row g-3 align-items-end">
    <div class="col-md-5">
      <div class="search-wrap">
        <i class="bi bi-search"></i>
        <input type="text" id="dirSearch" class="form-control" placeholder="Search by name, ID, email…">
      </div>
    </div>
    <div class="col-md-3 col-6">
      <select id="filterDept" class="form-select filter-select">
        <option value="">All Departments</option>
        <option value="Front Office">Front Office</option>
        <option value="Workshop">Workshop</option>
      </select>
    </div>
    <div class="col-md-2 col-6">
      <select id="filterStatus" class="form-select filter-select">
        <option value="">All Status</option>
        <option value="Full Time">Full Time</option>
        <option value="Part Time">Part Time</option>
      </select>
    </div>
    <div class="col-md-2 d-flex align-items-center justify-content-end">
      <div id="resultCount"><i class="bi bi-people"></i> <span id="countNum">0</span> employees</div>
    </div>
  </div>
</div>
 
<!-- Directory List -->
<div class="container mt-4 mb-5">
  <div id="dirList" class="row g-3"></div>
</div>
 
<footer class="text-center text-muted mt-5 py-3">
  <small>&copy; Grafix Print Hub</small>
</footer>
 
<!-- ═══════════════════════════════════════════════════════
     DETAIL / EDIT MODAL
════════════════════════════════════════════════════════ -->
<div id="empModal" class="modal-backdrop-custom" style="display:none;" onclick="handleModalBgClick(event)">
  <div class="dir-modal" onclick="event.stopPropagation()">
 
    <!-- Header -->
    <div class="dir-modal-header">
      <div id="modalAvatarWrap"></div>
      <div style="flex:1;min-width:0;">
        <div class="dir-modal-title" id="modalName">—</div>
        <div class="dir-modal-sub"   id="modalSub">—</div>
      </div>
      <button class="btn-modal-close" onclick="closeModal()"><i class="bi bi-x-lg"></i></button>
    </div>
 
    <!-- ── VIEW SECTION ───────────────────────────────── -->
    <div class="dir-modal-body view-section" id="viewSection">
      <div class="detail-grid" id="detailGrid"></div>
      <div style="height:8px;"></div>
    </div>
 
    <!-- ── EDIT SECTION ───────────────────────────────── -->
    <div class="dir-modal-body edit-section" id="editSection">
 
      <!-- Photo -->
      <div class="photo-update-row">
        <img id="editPhotoPreview" class="photo-update-preview" src="">
        <div>
          <label style="font-size:.82rem;font-weight:600;color:#374151;display:block;margin-bottom:4px;">Update Photo (Optional)</label>
          <input type="file" id="editPhotoInput" class="form-control form-control-sm" accept="image/*" style="max-width:220px;">
        </div>
      </div>
 
      <!-- Personal -->
      <div class="form-section-label">Personal Details</div>
      <div class="edit-form-grid">
        <div><label>Employee Name</label><input type="text" id="editName"></div>
        <div><label>Employee ID</label><input type="text" id="editEmpId" disabled></div>
        <div>
          <label>Status</label>
          <select id="editStatus">
            <option value="Full Time">Full Time</option>
            <option value="Part Time">Part Time</option>
          </select>
        </div>
        <div>
          <label>Department</label>
          <select id="editDept">
            <option value="Front Office">Front Office</option>
            <option value="Workshop">Workshop</option>
          </select>
        </div>
        <div><label>Date Joined</label><input type="date" id="editJoinDate"></div>
        <div><label>NIC</label><input type="text" id="editNic"></div>
        <div class="full-col"><label>Address</label><input type="text" id="editAddress"></div>
      </div>
 
      <!-- Contact -->
      <div class="form-section-label">Contact</div>
      <div class="edit-form-grid">
        <div><label>Email</label><input type="email" id="editEmail"></div>
        <div><label>Contact Number</label><input type="text" id="editContact"></div>
      </div>
 
      <!-- Remarks -->
      <div class="form-section-label">Remarks</div>
      <div class="edit-form-grid">
        <div class="full-col"><label>Remarks</label><textarea id="editRemarks" rows="3"></textarea></div>
      </div>
 
      <!-- ══ WEBSITE ACCESS EDIT ══════════════════════ -->
      <div class="form-section-label">Website Access</div>
      <div class="edit-form-grid">
        <div class="full-col">
          <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;">
            <input class="form-check-input" type="checkbox" id="editHasAccess"
                   style="width:18px;height:18px;cursor:pointer;"
                   onchange="toggleEditAccessSection(this)">
            <label for="editHasAccess" style="font-size:.88rem;font-weight:600;color:#374151;cursor:pointer;margin:0;">
              Give / Keep Website Access
            </label>
          </div>
 
          <div id="editAccessSection" class="access-edit-block" style="display:none;">
            <label>Job Role</label>
            <select id="editJobRole">
              <option value="" disabled>Select Role</option>
              <option value="financial_manager">Receptionist</option>
              <option value="resource_manager">Front Office Manager</option>
              <option value="customer_manager">Shop Keeper</option>
            </select>
 
            <label>Login Email</label>
            <input type="email" id="editLoginEmail" placeholder="login@example.com">
 
            <label>Login Password <span style="font-weight:400;font-size:.7rem;color:#9ca3af;">(leave blank to keep existing)</span></label>
            <div class="input-group" style="margin-bottom:10px;">
              <input type="password" id="editLoginPassword" class="form-control" placeholder="New password (min. 6 chars)">
              <button class="btn btn-outline-secondary" type="button" id="editTogglePasswordBtn" tabindex="-1">
                <i class="bi bi-eye-slash" id="editToggleIcon"></i>
              </button>
            </div>
 
            <!-- ── Page Access in Edit Modal (NEW) ────────────────── -->
            <div class="pas-edit-title">
              <i class="bi bi-grid-3x3-gap"></i> Page Access
            </div>
 
            <div class="pas-edit-grid" id="editPageAccessGrid">
 
              <label class="pas-edit-item" for="epa_om">
                <input class="pas-edit-check" type="checkbox" id="epa_om" value="order_management" onchange="updateEditPasCount()">
                <div class="pas-edit-tick"><i class="bi bi-check-lg"></i></div>
                <div class="pas-edit-icon"><i class="bi bi-clipboard-check"></i></div>
                <div class="pas-edit-label">Order Management</div>
              </label>
 
              <label class="pas-edit-item" for="epa_crm">
                <input class="pas-edit-check" type="checkbox" id="epa_crm" value="crm" onchange="updateEditPasCount()">
                <div class="pas-edit-tick"><i class="bi bi-check-lg"></i></div>
                <div class="pas-edit-icon"><i class="bi bi-people"></i></div>
                <div class="pas-edit-label">CRM</div>
              </label>
 
              <label class="pas-edit-item" for="epa_fin">
                <input class="pas-edit-check" type="checkbox" id="epa_fin" value="financial_management" onchange="updateEditPasCount()">
                <div class="pas-edit-tick"><i class="bi bi-check-lg"></i></div>
                <div class="pas-edit-icon"><i class="bi bi-cash-coin"></i></div>
                <div class="pas-edit-label">Financial Management</div>
              </label>
 
              <label class="pas-edit-item" for="epa_hr">
                <input class="pas-edit-check" type="checkbox" id="epa_hr" value="human_resources" onchange="updateEditPasCount()">
                <div class="pas-edit-tick"><i class="bi bi-check-lg"></i></div>
                <div class="pas-edit-icon"><i class="bi bi-person-badge"></i></div>
                <div class="pas-edit-label">Human Resources</div>
              </label>
 
              <label class="pas-edit-item" for="epa_rc">
                <input class="pas-edit-check" type="checkbox" id="epa_rc" value="resource_coordinator" onchange="updateEditPasCount()">
                <div class="pas-edit-tick"><i class="bi bi-check-lg"></i></div>
                <div class="pas-edit-icon"><i class="bi bi-boxes"></i></div>
                <div class="pas-edit-label">Resource Coordinator</div>
              </label>
 
            </div><!-- /pas-edit-grid -->
 
            <div class="pas-edit-footer">
              <button type="button" class="pas-edit-btn" onclick="editPasAll(true)">Select all</button>
              <button type="button" class="pas-edit-btn" onclick="editPasAll(false)">Clear all</button>
              <div class="pas-edit-count"><b id="editPasCountNum">0</b> of 5 selected</div>
            </div>
            <!-- ────────────────────────────────────────────────── -->
 
          </div>
        </div>
      </div>
      <!-- ════════════════════════════════════════════ -->
 
      <div style="height:8px;"></div>
    </div><!-- end edit-section -->
 
    <!-- Delete confirm -->
    <div class="delete-confirm-box" id="deleteConfirmBox">
      <p><i class="bi bi-exclamation-triangle-fill me-2"></i>Are you sure you want to delete <strong id="deleteNameLabel"></strong>? This cannot be undone.</p>
      <div class="d-flex gap-2 justify-content-center">
        <button class="btn btn-sm btn-danger" id="confirmDeleteBtn" onclick="confirmDelete()">Yes, Delete</button>
        <button class="btn btn-sm btn-secondary" onclick="cancelDelete()">Cancel</button>
      </div>
    </div>
 
    <!-- Action buttons -->
    <div class="dir-modal-actions">
      <button class="btn btn-edit" id="btnEdit" onclick="enterEditMode()"><i class="bi bi-pencil me-1"></i>Edit</button>
      <button class="btn btn-warning" id="btnResetPassword" onclick="resetEmployeePassword()" style="display:none;">
        <i class="bi bi-key me-1"></i>Reset Password
      </button>
      <button class="btn btn-save" id="btnSave" onclick="saveEmployee()" style="display:none;"><i class="bi bi-check-lg me-1"></i>Save Changes</button>
      <button class="btn btn-cancel-edit" id="btnCancelEdit" onclick="cancelEditMode()" style="display:none;"><i class="bi bi-x me-1"></i>Cancel</button>
      <button class="btn btn-delete" id="btnDelete" onclick="promptDelete()"><i class="bi bi-trash me-1"></i>Delete</button>
    </div>
 
  </div>
</div>

<script>
  // ── Edit modal: access section toggle ────────────────────────────────────
  function toggleEditAccessSection(cb) {
    document.getElementById('editAccessSection').style.display = cb.checked ? 'block' : 'none';
    if (!cb.checked) editPasAll(false);
  }
 
  // ── Edit password eye toggle ──────────────────────────────────────────────
  document.getElementById('editTogglePasswordBtn').addEventListener('click', function () {
    const inp = document.getElementById('editLoginPassword');
    const ico = document.getElementById('editToggleIcon');
    inp.type = inp.type === 'password' ? 'text' : 'password';
    ico.className = inp.type === 'password' ? 'bi bi-eye-slash' : 'bi bi-eye';
  });
 
  // ── Page access helpers (edit modal) ─────────────────────────────────────
  function updateEditPasCount() {
    const n = document.querySelectorAll('#editPageAccessGrid .pas-edit-check:checked').length;
    document.getElementById('editPasCountNum').textContent = n;
  }
 
  function editPasAll(checked) {
    document.querySelectorAll('#editPageAccessGrid .pas-edit-check').forEach(c => c.checked = checked);
    updateEditPasCount();
  }
 
  // Called by hr-script.js when populating the edit form for a selected employee.
  // Pass the employee's existing grantedPages array to pre-tick the checkboxes.
  window.populateEditPageAccess = function (grantedPages) {
    document.querySelectorAll('#editPageAccessGrid .pas-edit-check').forEach(c => {
      c.checked = Array.isArray(grantedPages) && grantedPages.includes(c.value);
    });
    updateEditPasCount();
  };
 
  // Called by hr-script.js saveEmployee() to get the chosen pages for Firestore.
  window.getEditSelectedPages = function () {
    return Array.from(document.querySelectorAll('#editPageAccessGrid .pas-edit-check:checked'))
                .map(c => c.value);
  };
 
  // ── Owner-only guard ──────────────────────────────────────────────────────
  document.addEventListener('DOMContentLoaded', () => {
    const role = sessionStorage.getItem('userRole');
    if (role && role !== 'order_manager') {
      window.location.href = '../../auth/login/access-denied.html';
    }
  });
</script>
 
</body>
