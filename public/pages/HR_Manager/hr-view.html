<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Employee Records | Grafix Print Hub</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../../css/hr-style.css">
  <link rel="stylesheet" href="../../css/menu.css">
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar navbar-dark shadow-sm sticky-top">
    <div class="container">
      <div class="d-flex align-items-center">
        <button class="btn btn-outline-light me-3" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebarMenu">
          <i class="bi bi-list fs-4"></i>
        </button>
        <a class="navbar-brand d-flex align-items-center" href="#">
          <img src="../../assets/logo.png" alt="Logo" height="65" class="me-2">
          Grafix Print Hub
        </a>
      </div>
    </div>
  </nav>


  <!-- SIDEBAR -->

<div class="offcanvas offcanvas-start" tabindex="-1" id="sidebarMenu"></div>

<div id="logoutModal" class="modal-overlay" style="display:none;">
    <div class="modal-box">
        <h5>Confirm Logout</h5>
        <p>Are you sure you want to leave?</p>
        <button onclick="logout()" class="modal-btn-confirm-red">Logout</button>
        <button onclick="closeLogoutModal()" class="modal-btn-cancel">Cancel</button>
    </div>
</div>



  <!-- HERO -->
  <div class="hero-section">
    <div class="container text-center">
      <h1 class="display-4">Employee Records</h1>
    </div>
  </div>

  <!-- MAIN CONTENT -->
  <div class="container mb-5">

    <!-- Search + Stats Bar -->
    <div class="view-topbar">
      <div class="view-stats" id="viewStats">
        <span class="view-stat-badge"><i class="bi bi-people-fill"></i> <span id="totalCount">0</span> Total</span>
        <span class="view-stat-badge active"><i class="bi bi-check-circle-fill"></i> <span id="activeCount">0</span> Active</span>
        <span class="view-stat-badge inactive"><i class="bi bi-dash-circle-fill"></i> <span id="inactiveCount">0</span> Inactive</span>
      </div>
      <div class="view-search-wrap">
        <i class="bi bi-search view-search-icon"></i>
        <input type="text" id="viewSearchInput" class="view-search-input" placeholder="Search by name, ID, department...">
      </div>
      <div class="view-filters">
        <select id="deptFilter" class="view-filter-select">
          <option value="">All Departments</option>
          <option value="Front Office">Front Office</option>
          <option value="Workshop">Workshop</option>
        </select>
        <select id="statusFilter" class="view-filter-select">
          <option value="">All Status</option>
          <option value="FullTime">Full Time</option>
          <option value="PartTime">Part Time</option>
        </select>
      </div>
    </div>

    <!-- Loading State -->
    <div id="viewLoading" class="view-loading">
      <div class="spinner-border text-primary" style="width:2.5rem;height:2.5rem;"></div>
      <p class="mt-3 text-muted">Loading employee records...</p>
    </div>

    <!-- Empty State -->
    <div id="viewEmpty" class="view-empty" style="display:none;">
      <i class="bi bi-person-x view-empty-icon"></i>
      <h5>No employees found</h5>
      <p class="text-muted">Try adjusting your search or filters.</p>
    </div>

    <!-- Employee Cards Grid -->
    <div id="employeeGrid" class="employee-grid" style="display:none;"></div>

  </div>

  <!-- DETAIL MODAL -->
  <div class="modal fade" id="detailModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title text-white fw-bold">
            <i class="bi bi-person-badge me-2"></i>Employee Details
          </h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body p-0" id="detailModalBody"></div>
      </div>
    </div>
  </div>

  <script src="../../js/navbar-loader.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-storage-compat.js"></script>
  <script src="../../js/firebase-config.js"></script>
  <script src="../../js/hr-script.js"></script>
  <script src="../../js/signin.js"></script>
</body>
</html>
