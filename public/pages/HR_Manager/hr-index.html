<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Human Resources | Grafix Print Hub</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <!-- Your custom CSS -->
  <link rel="stylesheet" href="../../css/hr-style.css">
  <link rel="stylesheet" href="../../css/menu.css">
</head>

<body>
  <nav class="navbar navbar-dark shadow-sm sticky-top">
    <div class="container">
        <div class="d-flex align-items-center">
            <button class="btn btn-outline-light me-3" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebarMenu">
                <i class="bi bi-list fs-4"></i>
            </button>
            <a class="navbar-brand d-flex align-items-center" href="#">
                <img src="../../assets/logo.png" alt="Logo" height="65" class="me-2">
                Grafix Print Hub
            </a>
        </div>
    </div>
</nav>

<div class="offcanvas offcanvas-start" tabindex="-1" id="sidebarMenu"></div>

<div id="logoutModal" class="modal-overlay" style="display:none;">
    <div class="modal-box">
        <h5>Confirm Logout</h5>
        <p>Are you sure you want to leave?</p>
        <button onclick="logout()" class="modal-btn-confirm-red">Logout</button>
        <button onclick="closeLogoutModal()" class="modal-btn-cancel">Cancel</button>
    </div>
</div>



  <!-- Hero Section (add this if you want content) -->
  <div class="hero-section">
    <div class="container text-center">
      <h1 class="display-4">Human Resources</h1>
    </div>
  </div>
  <br>
  <br>
  <br>


  <div class="d-flex flex-row gap-3 justify-content-center">
  <!-- Add Member Card -->
  <div class="card feature-card shadow" style="width: 18rem;">
    <div class="card-body text-center">
      <div class="icon-box">
        <i class="bi bi-person-plus"></i>
      </div>
      <h5 class="card-title">Add Employee</h5>
      <p class="card-text">Add new employee to the system</p>
      <a href="hr-add.html" class="btn btn-primary">Add Employee</a>
    </div>
  </div>


  <!-- View Employee Records Card -->
  <div class="card feature-card shadow" style="width: 18rem;">
    <div class="card-body text-center">
      <div class="icon-box">
        <i class="bi bi-folder2-open"></i>
      </div>
      <h5 class="card-title">View Employee Records</h5>
      <p class="card-text">Access and review employee data</p>
      <a href="hr-view.html" class="btn btn-primary">View Records</a>
    </div>
  </div>

  <!-- Print Record Card -->
  <div class="card feature-card shadow" style="width: 18rem;">
    <div class="card-body text-center">
      <div class="icon-box">
        <i class="bi bi-printer"></i>
      </div>
      <h5 class="card-title">Print Record</h5>
      <p class="card-text">Generate and print employee reports</p>
      <a href="hr-print.html" class="btn btn-primary">Print Record</a>
    </div>
  </div>
</div>

<footer class="text-center text-muted mt-5 py-3">
        <small>&copy; Grafix Print Hub </small>
    </footer>

  <!-- Bootstrap JavaScript Bundle with Popper -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  

  

  <!--firebase-->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-storage-compat.js"></script>
    <script src="../../js/firebase-config.js"></script>

  <!-- Link to your custom script.js -->
  <script src="../../js/hr-script.js"></script>
  <script src="../../js/navbar-loader.js"></script>
  <script src="../../js/signin.js"></script>


</body>
</body>
</html>
