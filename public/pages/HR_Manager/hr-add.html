<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Employee | Grafix Print Hub</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
<link rel="stylesheet" href="../../css/hr-style.css">
<link rel="stylesheet" href="../../css/menu.css">

<style>
    /* Page Access Selector Styles */
    .pas-section-title {
      font-size: .75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .07em;
      color: #374151;
      margin: 14px 0 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .pas-section-title i { color: #ffe785; font-size: .85rem; }

    .pas-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
      border: 1.5px solid #e5e7eb;
      border-radius: 12px;
      overflow: hidden;
    }
    .pas-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 10px 11px;
      cursor: pointer;
      border-bottom: 1px solid #f0f2f5;
      border-right: 1px solid #f0f2f5;
      transition: background .15s;
    }
    .pas-item:nth-child(even) { border-right: none; }
    .pas-item:nth-last-child(-n+2) { border-bottom: none; }
    .pas-item:last-child { grid-column: 1 / -1; border-right: none; border-bottom: none; }
    .pas-item:hover { background: #fffbeb; }

    .pas-check { display: none; }
    .pas-tick {
      width: 17px; height: 17px; border-radius: 5px;
      border: 2px solid #d1d5db; flex-shrink: 0; margin-top: 2px;
      display: flex; align-items: center; justify-content: center;
      font-size: .6rem; color: transparent;
      background: white; transition: all .15s;
    }
    .pas-icon {
      width: 24px; height: 24px; border-radius: 6px;
      background: #f3f4f6; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: .8rem; color: #6b7280;
    }
    .pas-text { flex: 1; min-width: 0; }
    .pas-label { font-size: .78rem; font-weight: 600; color: #111827; line-height: 1.2; }
    .pas-desc { font-size: .68rem; color: #9ca3af; margin-top: 1px; }

    .pas-check:checked ~ .pas-tick { background: #34495e; border-color: #34495e; color: white; }
    .pas-check:checked ~ .pas-icon { background: #ffe785; color: #34495e; }
    .pas-item:has(.pas-check:checked) { background: #fffef0; }

    .pas-footer { display: flex; align-items: center; margin-top: 5px; }
    .pas-btn { background: none; border: none; font-size: .73rem; font-weight: 600;
               color: #6b7280; cursor: pointer; text-decoration: underline; padding: 0 8px 0 0; }
    .pas-btn:hover { color: #34495e; }
    .pas-count { font-size: .71rem; color: #6b7280; margin-left: auto; }
    .pas-count b { color: #34495e; }
</style>
</head>

<body>

<nav class="navbar navbar-dark shadow-sm sticky-top">
<div class="container">
<div class="d-flex align-items-center">
<button class="btn btn-outline-light me-3" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebarMenu">
<i class="bi bi-list fs-4"></i>
</button>
<a class="navbar-brand d-flex align-items-center" href="#">
<img src="../../assets/logo.png" alt="Logo" height="65" class="me-2">
        Grafix Print Hub
</a>
</div>
</div>
</nav>

<div class="offcanvas offcanvas-start" tabindex="-1" id="sidebarMenu"></div>

<div id="logoutModal" class="modal-overlay" style="display:none;">
<div class="modal-box">
<h5>Confirm Logout</h5>
<p>Are you sure you want to leave?</p>
<button onclick="logout()" class="modal-btn-confirm-red">Logout</button>
<button onclick="closeLogoutModal()" class="modal-btn-cancel">Cancel</button>
</div>
</div>

<div class="hero-section">
<div class="container text-center">
<h1 class="display-4">Add New Employee</h1>
</div>
</div>

<div class="container mt-3">
<a href="hr-index.html" class="btn btn-outline-secondary back-btn">
<i class="bi bi-arrow-left"></i> Back to Dashboard
</a>
</div>

<br>

<form id="addEmployeeForm" class="container form-container needs-validation" novalidate>

<div id="notificationArea"></div>

<div class="row g-4">

<!-- LEFT — Personal Info -->
<div class="col-md-6">
<div class="form-box">
  <div class="mb-3">
    <label class="form-label">Employee Name</label>
    <input type="text" id="empName" class="form-control" placeholder="e.g. Kamal Perera" required>
  </div>
  <div class="mb-3">
    <label class="form-label">Employee ID</label>
    <input type="text" id="empId" class="form-control" placeholder="e.g. EMP-001" required>
  </div>
  <div class="mb-3">
    <label class="form-label">Status</label>
    <select id="empStatus" class="form-select" required>
      <option value="" disabled selected>Select Status</option>
      <option value="Full Time">Full Time</option>
      <option value="Part Time">Part Time</option>
    </select>
  </div>
  <div class="mb-3">
    <label class="form-label">Department</label>
    <select id="empDepartment" class="form-select" required>
      <option value="" disabled selected>Select Department</option>
      <option value="Front Office">Front Office</option>
      <option value="Workshop">Workshop</option>
    </select>
  </div>
  <div class="mb-3">
    <label class="form-label">Date Joined</label>
    <input type="date" id="empJoinDate" class="form-control" required>
  </div>
  <div class="mb-3">
    <label class="form-label">NIC</label>
    <input type="text" id="empNic" class="form-control" placeholder="e.g. 901234567V or 200012345678" required>
  </div>
  <div class="mb-3">
    <label class="form-label">Address</label>
    <input type="text" id="empAddress" class="form-control" placeholder="Street, City" required>
  </div>
</div>
</div>

<!-- RIGHT — Contact & Details -->
<div class="col-md-6">
<div class="form-box">
  <div class="mb-3">
    <label class="form-label">Email</label>
    <input type="email" id="empEmail" class="form-control" placeholder="name@example.com" required>
  </div>
  <div class="mb-3">
    <label class="form-label">Contact Number</label>
    <input type="text" id="empContact" class="form-control" placeholder="e.g. 0771234567" required>
  </div>
  <div class="mb-3">
    <label class="form-label">Remarks</label>
    <textarea id="empRemarks" class="form-control" rows="3" placeholder="Optional notes…"></textarea>
  </div>

  <!-- Website Access -->
  <div class="form-check mt-3">
    <input class="form-check-input" type="checkbox" id="hasAccess" onchange="toggleAccessSection(this)">
    <label class="form-check-label" for="hasAccess" style="font-weight:600; color:#374151;">
      Give Website Access
    </label>
  </div>

  <div id="accessSection" style="display:none; margin-top:15px; padding:14px; background:#f9fafb; border-radius:10px; border:1px solid #e5e7eb;">
    <div class="mb-2">
      <label class="form-label">Job Role</label>
      <select id="jobRole" class="form-select">
        <option value="" disabled selected>Select Role</option>
        <option value="financial_manager">Receptionist</option>
        <option value="resource_manager">Front Office Manager</option>
        <option value="customer_manager">Shop Keeper</option>
      </select>
    </div>

    <div class="mb-2">
      <label class="form-label">Login Email <span style="color:#dc2626; font-size:0.75rem;">(Owner's Email)</span></label>
      <input type="email" id="loginEmail" class="form-control" readonly>
    </div>

    <div class="mb-2">
      <label class="form-label
