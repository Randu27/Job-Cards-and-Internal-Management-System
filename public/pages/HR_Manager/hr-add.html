<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Human Resources | Grafix Print Hub</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

  <!--CSS -->
  <link rel="stylesheet" href="../../css/hr-style.css">
  <link rel="stylesheet" href="../../css/menu.css">
</head>

<body>

<nav class="navbar navbar-dark shadow-sm sticky-top">
  <div class="container">
    <div class="d-flex align-items-center">
      <button class="btn btn-outline-light me-3" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebarMenu">
        <i class="bi bi-list fs-4"></i>
      </button>
      <a class="navbar-brand d-flex align-items-center" href="#">
        <img src="../../assets/logo.png" alt="Logo" height="65" class="me-2">
        Grafix Print Hub
      </a>
    </div>
  </div>
</nav>

<div class="offcanvas offcanvas-start" tabindex="-1" id="sidebarMenu"></div>

<div id="logoutModal" class="modal-overlay" style="display:none;">
  <div class="modal-box">
    <h5>Confirm Logout</h5>
    <p>Are you sure you want to leave?</p>
    <button onclick="logout()" class="modal-btn-confirm-red">Logout</button>
    <button onclick="closeLogoutModal()" class="modal-btn-cancel">Cancel</button>
  </div>
</div>

<div class="hero-section">
  <div class="container text-center">
    <h1 class="display-4">Add New Employee</h1>
  </div>
</div>

<div class="container mt-3">
  <a href="hr-index.html" class="btn btn-outline-secondary back-btn">
    <i class="bi bi-arrow-left"></i> Back to Dashboard
  </a>
</div>

<br>

<form id="addEmployeeForm" class="container form-container needs-validation" novalidate>

  <div id="notificationArea"></div>

  <div class="row g-4">

    <!-- LEFT SIDE -->
    <div class="col-md-6">
      <div class="form-box">

        <div class="mb-3">
          <label class="form-label">Employee Name</label>
          <input type="text" id="empName" class="form-control" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Employee ID</label>
          <input type="text" id="empId" class="form-control" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Status</label>
          <select id="empStatus" class="form-select" required>
            <option value="" disabled selected>Select Status</option>
            <option value="Full Time">Full Time</option>
            <option value="Part Time">Part Time</option>
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label">Department</label>
          <select id="empDepartment" class="form-select" required>
            <option value="" disabled selected>Select Department</option>
            <option value="Front Office">Front Office</option>
            <option value="Workshop">Workshop</option>
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label">Date Joined</label>
          <input type="date" id="empJoinDate" class="form-control" required>
        </div>

        <div class="mb-3">
          <label class="form-label">NIC</label>
          <input type="text" id="empNic" class="form-control" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Address</label>
          <input type="text" id="empAddress" class="form-control" required>
        </div>

      </div>
    </div>

    <!-- RIGHT SIDE -->
    <div class="col-md-6">
      <div class="form-box">

        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" id="empEmail" class="form-control" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Contact Number</label>
          <input type="text" id="empContact" class="form-control" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Remarks</label>
          <textarea id="empRemarks" class="form-control" rows="3"></textarea>
        </div>

        <!-- 🔐 WEBSITE ACCESS SECTION -->
        <div class="form-check mt-3">
          <input class="form-check-input" type="checkbox" id="hasAccess">
          <label class="form-check-label">
            Give Website Access
          </label>
        </div>

        <div id="accessSection" style="display:none; margin-top:15px;">

          <label class="form-label">Job Role</label>
          <select id="jobRole" class="form-select mb-2">
            <option value="Owner">Owner</option>
            <option value="Front Office Manager">Front Office Manager</option>
            <option value="Receptionist">Receptionist</option>
            <option value="Shop Keeper">Shop Keeper</option>
          </select>

          <label class="form-label">Login Email</label>
          <input type="email" id="loginEmail" class="form-control mb-2">

          <label class="form-label">Login Password</label>
          <input type="password" id="loginPassword" class="form-control mb-2">

        </div>

        <!-- IMAGE -->
        <div class="mb-3 mt-3">
          <label class="form-label">Add Photo (Optional)</label>
          <input type="file" id="empImage" class="form-control" accept="image/*">
        </div>

      </div>
    </div>

  </div>

  <div class="text-center mt-4">
    <button type="submit" class="btn btn-primary">Add Employee</button>
  </div>

</form>

<footer class="text-center text-muted mt-5 py-3">
  <small>&copy; Grafix Print Hub</small>
</footer>

<!-- Bootstrap -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-storage-compat.js"></script>
<script src="../../js/firebase-config.js"></script>

<!-- EXISTING SCRIPTS -->
<script src="../../js/hr-script.js"></script>
<script src="../../js/navbar-loader.js"></script>
<script src="../../js/signin.js"></script>

<!-- ✅ NEW JS -->
<script>
  const hasAccess = document.getElementById("hasAccess");
  const accessSection = document.getElementById("accessSection");

  hasAccess.addEventListener("change", function () {
    accessSection.style.display = this.checked ? "block" : "none";
  });

  document.getElementById("addEmployeeForm").addEventListener("submit", function(e) {

    const isChecked = hasAccess.checked;

    if (isChecked) {
      const role = document.getElementById("jobRole").value;
      const email = document.getElementById("loginEmail").value;
      const password = document.getElementById("loginPassword").value;

      if (!role || !email || !password) {
        e.preventDefault();
        alert("Please fill all website access details");
      }
    }

    // Toggle password visibility for the Login Password field
    if (togglePasswordBtn && passwordInput) {
      togglePasswordBtn.addEventListener("click", function(e) {
        e.preventDefault();   // Prevent any accidental form behaviors
        const type = passwordInput.getAttribute("type") === "password" ? "text" : "password";
        passwordInput.setAttribute("type", type);
        
        // Toggle the eye icon (Bootstrap Icons)
        if (toggleIcon) {
          if (type === "text") {
            toggleIcon.classList.remove("bi-eye-slash");
            toggleIcon.classList.add("bi-eye");
          } else {
            toggleIcon.classList.remove("bi-eye");
            toggleIcon.classList.add("bi-eye-slash");
          }
        }
      });
    }

  });
</script>

</body>
</html>
