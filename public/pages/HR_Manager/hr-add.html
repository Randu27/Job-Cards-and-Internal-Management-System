    <div class="hero-section">

      <h1 class="display-4">Add New Employee</h1>
    </div>

<form id="addEmployeeForm" class="container form-container needs-validation" novalidate>

  <div id="notificationArea"></div>

  <div class="row g-4">

    <!-- LEFT SIDE -->
    <div class="col-md-6">
      <div class="form-box">

        <div class="mb-3">
          <label class="form-label">Employee Name</label>
          <input type="text" id="empName" class="form-control" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Employee ID</label>
          <input type="text" id="empId" class="form-control" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Status</label>
          <select id="empStatus" class="form-select" required>
            <option value="" disabled selected>Select Status</option>
            <option value="FullTime">Full Time</option>
            <option value="PartTime">Part Time</option>
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label">Department</label>
          <select id="empDepartment" class="form-select" required>
            <option value="" disabled selected>Select Department</option>
            <option value="Front Office">Front Office</option>
            <option value="Workshop">Workshop</option>
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label">Date Joined</label>
          <input type="date" id="empJoinDate" class="form-control" required>
        </div>

        <div class="mb-3">
          <label class="form-label">NIC</label>
          <input type="text" id="empNic" class="form-control" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Address</label>
          <input type="text" id="empAddress" class="form-control" required>
        </div>

      </div>
    </div>

    <!-- RIGHT SIDE -->
    <div class="col-md-6">
      <div class="form-box">

        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" id="empEmail" class="form-control" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Contact Number</label>
          <input type="text" id="empContact" class="form-control" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Remarks</label>
          <textarea id="empRemarks" class="form-control" rows="6"></textarea>
        </div>

        <!-- ✅ OPTIONAL IMAGE -->
        <div class="mb-3">
          <label class="form-label">Add Photo (Optional)</label>
          <input type="file" id="empImage" class="form-control" accept="image/*">
        </div>

        <!-- ✅ IMAGE PREVIEW -->
        <div class="text-center">
          <img id="imagePreview"
               src="https://via.placeholder.com/150"
               style="width:150px;height:150px;object-fit:cover;border-radius:10px;">
        </div>

      </div>
    </div>

  </div>

  <!-- Button -->
  <div class="text-center mt-4">
    <button type="submit" class="btn add-btn">Add Member</button>
  </div>

</form>
