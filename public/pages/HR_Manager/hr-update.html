</head>
<body>
  <nav class="navbar navbar-dark shadow-sm sticky-top">
    <div class="container">
        <div class="d-flex align-items-center">
            <button class="btn btn-outline-light me-3" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebarMenu">
                <i class="bi bi-list fs-4"></i>
            </button>
            <a class="navbar-brand d-flex align-items-center" href="#">
                <img src="../../assets/logo.png" alt="Logo" height="65" class="me-2">
                Grafix Print Hub
            </a>
        </div>
    </div>
</nav>

<div class="offcanvas offcanvas-start" tabindex="-1" id="sidebarMenu"></div>

<div id="logoutModal" class="modal-overlay" style="display:none;">
    <div class="modal-box">
        <h5>Confirm Logout</h5>
        <p>Are you sure you want to leave?</p>
        <button onclick="logout()" class="modal-btn-confirm-red">Logout</button>
        <button onclick="closeLogoutModal()" class="modal-btn-cancel">Cancel</button>
    </div>
</div>



    <div class="hero-section">
    <div class="container text-center">
      <h1 class="display-4">Send Updates</h1>
    </div>
  </div>

   <!-- Back to dashboard -->
<div class="container mt-3">
  <a href="hr-index.html" class="btn btn-outline-secondary back-btn">
    <i class="bi bi-arrow-left"></i> Back to Dashboard
  </a>
</div>
<br>
  
  <!-- Add this after the existing employee form section -->
<div class="card mt-4">
  <div class="card-header" style="background: linear-gradient(135deg, #ffe785, var(--accent-teal));">
    <h5 class="mb-0 text-dark">
      <i class="bi bi-envelope-paper me-2"></i>Send Company Updates
    </h5>
  </div>
  <div class="card-body">
    <div class="row">
      <div class="col-md-12 mb-3">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <label class="fw-bold">Select Recipients:</label>
          <div>
            <button type="button" id="selectAllEmployeesBtn" class="btn btn-sm btn-outline-primary me-2">
              <i class="bi bi-check-all"></i> All Employees
            </button>
            <button type="button" id="clearSelectionBtn" class="btn btn-sm btn-outline-secondary">
              <i class="bi bi-x-circle"></i> Clear
            </button>
          </div>
        </div>
        
        <!-- Employee selection list -->
        <div class="employee-selection-list border rounded p-3" style="max-height: 300px; overflow-y: auto;">
          <div id="emailEmployeeList" class="row g-2">
            <div class="col-12 text-center text-muted py-3">
              <div class="spinner-border spinner-border-sm me-2"></div>
              Loading employees...
            </div>
          </div>
        </div>
      </div>
      
      <div class="col-md-12 mb-3">
        <label class="fw-bold">Email Subject:</label>
        <input type="text" id="emailSubject" class="form-control" placeholder="Enter email subject">
      </div>
      
      <div class="col-md-12 mb-3">
        <label class="fw-bold">Email Message:</label>
        <textarea id="emailMessage" class="form-control" rows="6" placeholder="Enter your message here..."></textarea>
      </div>
      
      <div class="col-md-12">
        <button type="button" id="sendEmailBtn" class="btn btn-primary" style="background: linear-gradient(135deg, #ffe785, var(--accent-teal)); border: none; color: #000;">
          <i class="bi bi-send"></i> Send Emails
        </button>
        <button type="button" id="previewEmailBtn" class="btn btn-secondary ms-2">
          <i class="bi bi-eye"></i> Preview
        </button>
      </div>
    </div>
  </div>
</div>

<!-- Email Preview Modal -->
<div class="modal fade" id="emailPreviewModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content">
      <div class="modal-header" style="background: linear-gradient(135deg, #ffe785, var(--accent-teal));">
        <h5 class="modal-title text-dark">
          <i class="bi bi-envelope"></i> Email Preview
        </h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="emailPreviewContent">
        <!-- Preview content will be inserted here -->
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        <button type="button" id="sendFromPreviewBtn" class="btn btn-primary" style="background: linear-gradient(135deg, #ffe785, var(--accent-teal)); border: none; color: #000;">
          <i class="bi bi-send"></i> Send Now
        </button>
      </div>
    </div>
  </div>
</div>

<footer class="text-center text-muted mt-5 py-3">
        <small>&copy; Grafix Print Hub </small>
    </footer>

<!-- Bootstrap JavaScript Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
