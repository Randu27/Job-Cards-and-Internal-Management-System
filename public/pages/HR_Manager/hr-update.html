<!-- Email Preview Modal -->
<div class="modal fade" id="emailPreviewModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content">
      <div class="modal-header" style="background: linear-gradient(135deg, #ffe785, var(--accent-teal));">
        <h5 class="modal-title text-dark">
          <i class="bi bi-envelope"></i> Email Preview
        </h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="emailPreviewContent">
        <!-- Preview content will be inserted here -->
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        <button type="button" id="sendFromPreviewBtn" class="btn btn-primary" style="background:  #21b55e; border: none; color: #000;">
          <i class="bi bi-send"></i> Send Now
        </button>
      </div>
    </div>
  </div>
</div>
