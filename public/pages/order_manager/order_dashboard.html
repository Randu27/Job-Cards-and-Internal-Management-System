<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Dashboard | Grafix Print Hub</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <link rel="stylesheet" href="../../css/order_dashboard.css">
</head>

<body>

    <nav class="navbar navbar-dark shadow-sm sticky-top">
        <div class="container">
            <div class="d-flex align-items-center">
                <button class="btn btn-outline-light me-3" type="button" data-bs-toggle="offcanvas"
                    data-bs-target="#sidebarMenu">
                    <i class="bi bi-list fs-4"></i>
                </button>
                <a class="navbar-brand d-flex align-items-center" href="#">
                    <img src="../../assets/logo.png" alt="Logo" height="65" class="me-2">
                    Grafix Print Hub
                </a>
            </div>
        </div>
    </nav>

    <div class="offcanvas offcanvas-start" tabindex="-1" id="sidebarMenu">
        <div class="offcanvas-header border-bottom border-secondary">
            <h5 class="offcanvas-title fw-bold text-black">Main Menu</h5>
            <button type="button" class="btn-close btn-close-black" data-bs-dismiss="offcanvas"></button>
        </div>
        <div class="offcanvas-body p-0">
            <ul class="nav flex-column mt-3">
                <li class="nav-item"><a href="../orders/index.html" class="nav-link active"><i
                            class="bi bi-card-checklist"></i> Order Admin</a></li>
                <li class="nav-item"><a href="../financial_manager/financial_dashboard.html" class="nav-link"><i
                            class="bi bi-cash-stack"></i>
                        Financial Management</a></li>
                <li class="nav-item"><a href="../resource/index.html" class="nav-link"><i class="bi bi-box-seam"></i>
                        Resource Coord.</a></li>
                <li class="nav-item"><a href="../crm/index.html" class="nav-link"><i class="bi bi-people"></i> CRM</a>
                </li>
                <li class="nav-item"><a href="../hr/index.html" class="nav-link"><i class="bi bi-person-badge"></i>
                        Human Resources</a></li>
                <li class="nav-item"><a href="#" onclick="logout()" class="nav-link"><i
                            class="bi bi-box-arrow-right"></i>
                        LogOut</a>
                    <!-- <button onclick="logout()">Logout </button> -->
                </li>
            </ul>
        </div>
    </div>

    <header class="hero-section text-center">
        <div class="container">
            <h1 class="display-4 fw-bold">Order Management</h1>
        </div>
    </header>

    <div class="container my-5">
        <div class="row g-4 justify-content-center">


            <!-- New Order Card sets -->
            <div class="col-md-5">
                <div class="card shadow-sm border-0 card-hover">
                    <div class="card-body text-center p-5">
                        <div class="icon-circle bg-primary bg-opacity-10 mx-auto mb-4">
                            <i class="bi bi-plus-circle-fill text-primary" style="font-size: 3rem;"></i>
                        </div>
                        <h3 class="card-title fw-bold mb-3">Create New Order</h3>
                        <p class="text-muted mb-4">Add a new order to the system. </p>
                        <button class="btn btn-primary btn-lg px-5 rounded-pill">Create Order</button>
                    </div>
                </div>
            </div>

            <!-- View Orders Card sets-->
            <div class="col-md-5">
                <div class="card shadow-sm border-0 card-hover">
                    <div class="card-body text-center p-5">
                        <div class="icon-circle bg-success bg-opacity-10 mx-auto mb-4">
                            <i class="bi bi-card-checklist text-success" style="font-size: 3rem;"></i>
                        </div>
                        <h3 class="card-title fw-bold mb-3">View Orders</h3>
                        <p class="text-muted mb-4">see all orders, edit and delete. </p>
                        <button class="btn btn-success btn-lg px-5 rounded-pill">View Records</button>
                    </div>
                </div>
            </div>
        </div>
    </div>


    <footer class="text-center text-muted mt-5 py-3">
        <small>&copy; Grafix Print Hub </small>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="../../js/order_dashboard.js"></script>


    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <script src="../../js/firebase-config.js"></script>

    <script src="../../js/signin.js"></script>

</body>

</html>
