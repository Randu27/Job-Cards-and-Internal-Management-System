<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Grafix Printing Hub</title>
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

    <!-- dark theme toggle button -->

    <button class="theme-toggle" id="themeToggle">
        <i class="fa-solid fa-moon" id="moonIcon"></i>
        <i class="fa-solid fa-sun" id="sunIcon" style="display: none;"></i>
    </button>
    <div class="login-container">
        <div class="login-container">
            <div class="login-box">
                <div class="login-header">
                    <h1>Grafix Printing Hub</h1>
                    <p>Management System</p>
                </div>

                <form id="loginForm">
                    <div class="input-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" placeholder="Enter your email" required>
                    </div>

                    <div class="input-group">
                        <label for="password">Password</label>
                        <div class="password-wrapper">
                            <input type="password" id="password" placeholder="Enter your password" required>
                            <button type="button" class="toggle-password" id="togglePassword">
                                <i class="fa-regular fa-eye show-icon"></i>
                                <i class="fa-regular fa-eye-slash hide-icon" style="display: none;"></i>
                            </button>
                        </div>
                    </div>

                    <div class="role-select">
                        <label for="role">Select Role</label>
                        <select id="role" required>
                            <option value="">Choose your role</option>
                            <option value="order_manager">Order Manager</option>
                            <option value="financial_manager">Financial Manager</option>
                            <option value="resource_manager">Resource Manager</option>
                            <option value="customer_manager">Customer Manager</option>
                            <option value="hr_manager">HR Manager</option>
                        </select>
                    </div>

                    <button type="submit" class="btn-login">Login</button>

                    <div id="error-message" class="error-message"></div>
                </form>

                <div class="contact-admin">
                    <p>Don't have access? Contact HR Manager</p>
                </div>
            </div>
        </div>
        <div id="deploy-version" style="font-size:12px; color:gray; text-align:center; margin-top:10px;"></div>

        <script src="version.js"></script>
        <script>
            document.getElementById("deploy-version").innerText = "Version: " + VERSION;
        </script>


        <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
        <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
        <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
        <script src="../public/js/firebase-config.js"></script>
        <script src="../public/js/signin.js"></script>
    </div>
</body>

</html>
