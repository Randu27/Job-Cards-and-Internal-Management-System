<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Login | Grafix Print Hub</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(145deg, #34495e 0%, #ffe785 30%, #34495e 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      overflow-x: hidden;
    }

    .bg-animation {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 0;
    }

    .bg-animation .circle {
      position: absolute;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      animation: float 20s infinite linear;
    }

    @keyframes float {
      0% {
        transform: translateY(0) rotate(0deg);
      }

      100% {
        transform: translateY(-100vh) rotate(360deg);
      }
    }

    .login-container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 480px;
    }

    .login-card {
      background: rgba(220, 220, 220, 0.98);
      backdrop-filter: blur(10px);
      border-radius: 30px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      overflow: hidden;
      animation: slideUp 0.6s ease;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .login-header {
      background: #ffe785;
      padding: 20px 15px;
      text-align: center;
      color: #34495e;
    }

    .login-header h2 {
      font-size: 1.8rem;
      font-weight: 700;
      margin-bottom: 5px;
    }

    .login-header p {
      opacity: 0.9;
      font-size: 0.9rem;
    }

    .login-body {
      padding: 30px;
    }

    /* Role Dropdown */
    .role-selection {
      margin-bottom: 25px;
    }

    .role-title {
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #34495e;
      margin-bottom: 10px;
      display: block;
    }

    .custom-dropdown {
      position: relative;
      width: 100%;
    }

    .dropdown-selected {
      background: #f9fafb;
      border: 2px solid #e5e7eb;
      border-radius: 12px;
      padding: 12px 15px;
      font-size: 0.95rem;
      font-weight: 500;
      color: #1f2937;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.2s ease;
    }

    .dropdown-selected:hover {
      border-color: #ffe785;
      background: #ffffff;
    }

    .dropdown-selected span i {
      margin-right: 10px;
      color: #ffe785;
    }

    .dropdown-arrow {
      transition: transform 0.2s;
      color: #6b7280;
    }

    .custom-dropdown.active .dropdown-arrow {
      transform: rotate(180deg);
    }

    .dropdown-menu-custom {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      width: 100%;
      background: white;
      border-radius: 16px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
      border: 1px solid #eef2f6;
      z-index: 100;
      max-height: 280px;
      overflow-y: auto;
      opacity: 0;
      visibility: hidden;
      transform: translateY(-10px);
      transition: all 0.2s ease;
    }

    .custom-dropdown.active .dropdown-menu-custom {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .dropdown-option {
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      transition: background 0.2s;
      border-bottom: 1px solid #f0f2f5;
    }

    .dropdown-option:last-child {
      border-bottom: none;
    }

    .dropdown-option:hover {
      background: #ffe785;
    }

    .dropdown-option i {
      width: 24px;
      color: #ffe785;
      font-size: 1.2rem;
    }

    .option-text {
      font-weight: 500;
      color: #1f2937;
    }

    .option-desc {
      font-size: 0.7rem;
      color: #6b7280;
      margin-top: 2px;
    }

    /* Form Styles */
    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      font-size: 0.85rem;
      font-weight: 600;
      color: #374151;
      margin-bottom: 8px;
      display: block;
    }

    .input-group-custom {
      position: relative;
    }

    .input-group-custom i {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: #9ca3af;
      font-size: 1.1rem;
    }

    .input-group-custom input {
      width: 100%;
      padding: 12px 15px 12px 45px;
      border: 2px solid #e5e7eb;
      border-radius: 12px;
      font-size: 0.95rem;
      transition: all 0.3s ease;
      font-family: inherit;
      background: white;
    }

    .input-group-custom input:focus {
      outline: none;
      border-color: #ffe785;
      box-shadow: 0 0 0 3px rgba(255, 231, 133, 0.2);
    }

    .login-btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #ffe785 0%, #909192 100%);
      color: #535557;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 10px;
    }

    .login-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
      background: linear-gradient(135deg, #ffe99c 0%, #a0a1a4 100%);
    }

    .login-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .alert-custom {
      padding: 12px 15px;
      border-radius: 12px;
      margin-bottom: 20px;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 10px;
      animation: slideIn 0.3s ease;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateX(-20px);
      }

      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .alert-error {
      background: #fee2e2;
      color: #dc2626;
      border-left: 4px solid #dc2626;
    }

    .alert-success {
      background: #d1fae5;
      color: #059669;
      border-left: 4px solid #059669;
    }

    .spinner-small {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(83, 85, 87, 0.3);
      border-radius: 50%;
      border-top-color: #535557;
      animation: spin 0.6s linear infinite;
      margin-right: 8px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (max-width: 480px) {
      .login-body {
        padding: 20px;
      }

      .dropdown-option {
        padding: 10px 12px;
      }
    }
  </style>
</head>

<body>

  <div class="bg-animation" id="bgAnimation"></div>

  <div class="login-container">
    <div class="login-card">

      <div class="login-header">
        <img src="../../assets/logo.png" alt="Logo" height="100" class="me-2" onerror="this.style.display='none'">
        <h2>Grafix Print Hub</h2>
        <p>Job Card Management System</p>
      </div>

      <div class="login-body">



        <div id="alertMessage"></div>

        <form id="loginForm">
          <div class="form-group">
            <label>Email Address</label>
            <div class="input-group-custom">
              <i class="bi bi-envelope"></i>
              <input type="email" id="email" placeholder="Enter your email" autocomplete="email" required>
            </div>
          </div>

          <div class="form-group">
            <label>Password</label>
            <div class="input-group-custom">
              <i class="bi bi-lock"></i>
              <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password"
                required>
            </div>
          </div>

          <button type="submit" class="login-btn" id="loginBtn">
            <i class="bi bi-box-arrow-in-right"></i> Login
          </button>
        </form>

      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/signin.js"></script>

</body>

</html>
