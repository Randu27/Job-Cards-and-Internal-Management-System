name: Deploy to Firebase Hosting with Semantic Version

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repo
      - uses: actions/checkout@v3

      # 2️⃣ Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      # 3️⃣ Increment semantic version and generate version.js
      - name: Generate version.js with semantic version
        id: version
        run: |
          VERSION_FILE=public/version.txt

          # If file exists, read major/minor/patch
          if [ -f $VERSION_FILE ]; then
            IFS='.' read -r MAJOR MINOR COUNT < $VERSION_FILE
          else
            MAJOR=1
            MINOR=0
            COUNT=0
          fi

          # Increment count
          COUNT=$((COUNT + 1))

          # Every 10 edits, increment minor and reset count
          if [ $COUNT -ge 10 ]; then
            MINOR=$((MINOR + 1))
            COUNT=0
          fi

          # Every 10 minor increments, increment major and reset minor
          if [ $MINOR -ge 10 ]; then
            MAJOR=$((MAJOR + 1))
            MINOR=0
          fi

          # Save new version for next run
          echo "$MAJOR.$MINOR.$COUNT" > $VERSION_FILE

          # Generate version.js for Sign Up page
          echo "// Auto-generated version file" > public/version.js
          echo "const VERSION = 'V$MAJOR.$MINOR - $(date +"%d %b %Y %H:%M")';" >> public/version.js

          echo "Deployed version: V$MAJOR.$MINOR"

      # 4️⃣ Install Firebase CLI
      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # 5️⃣ Deploy to Firebase
      - name: Deploy to Firebase
        run: firebase deploy --only hosting --token ${{ secrets.FIREBASE_TOKEN }}