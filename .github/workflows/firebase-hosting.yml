name: Deploy to Firebase Hosting with Version

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository
      - uses: actions/checkout@v3

      # 2️⃣ Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      # 3️⃣ Generate semantic version.js
      - name: Generate version.js (Vx.y)
        id: version
        run: |
          VERSION_FILE=public/version.txt

          # Read existing version numbers or start new
          if [ -f $VERSION_FILE ]; then
            IFS='.' read -r MAJOR MINOR COUNT < $VERSION_FILE
          else
            MAJOR=1
            MINOR=0
            COUNT=0
          fi

          # Increment push count
          COUNT=$((COUNT + 1))

          # Every 10 edits, increment minor version
          if [ $COUNT -ge 10 ]; then
            MINOR=$((MINOR + 1))
            COUNT=0
          fi

          # Every 10 minor versions, increment major version
          if [ $MINOR -ge 10 ]; then
            MAJOR=$((MAJOR + 1))
            MINOR=0
          fi

          # Save updated version for next workflow run
          echo "$MAJOR.$MINOR.$COUNT" > $VERSION_FILE

          # Generate version.js (Version only, no date)
          echo "// Auto-generated version file" > public/version.js
          echo "const VERSION = 'V$MAJOR.$MINOR';" >> public/version.js

          echo "Deployed version: V$MAJOR.$MINOR"

      # 4️⃣ Install Firebase CLI
      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # 5️⃣ Deploy to Firebase Hosting
      - name: Deploy to Firebase
        run: firebase deploy --only hosting --token ${{ secrets.FIREBASE_TOKEN }}